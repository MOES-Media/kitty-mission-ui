[package]
name = "kitty-stub"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# Never released: the stub is a test stand-in for the Mission Status service (contracts/stub-http.md).
publish = false

[[bin]]
name = "kitty-stub"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# The supervised stand-in test (tests/supervised.rs): Cargo hands `CARGO_BIN_EXE_kitty-stub` only to this package's tests.
kitty-core = { path = "../kitty-core" }
