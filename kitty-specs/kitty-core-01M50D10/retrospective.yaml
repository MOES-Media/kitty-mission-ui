  summary: 'The contract proof-leg timeout was confirmed unchanged by the first CI run'
  evidence_refs:
  - e-020
  details: 'The contract proof-leg timeout was raised from 19 to 21 as a projection (GATE-001). The first CI run confirmed it, and no timeout changed at landing.'
