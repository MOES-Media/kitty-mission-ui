- id: h-008
  category: process
  summary: 'The pre-merge squad closed two forward() traversal gaps and a flaky supervision test, and every fold was verified red on revert'
  evidence_refs:
  - e-020
  - e-021
  details: 'Three lens groups reviewed the integrated branch (reviews/premerge-r1-findings.md); none of the findings was above severity 3. The folds included forward() refusing dot segments, encoded separators, backslash, a double slash, non-ASCII and ''#'' (ARCH-008, SEC-001), then '';'' and ''%3b'' after the second round (R2-NEW-001); CoreConfig::new (ARCH-001); #[non_exhaustive] on the enums hosts match on (ARCH-002); the socket-ownership check before a non-matching answer counts as a contract mismatch (SEC-002); and the supervision test flake of about 2 in 110 runs (TEST-001). All 15 R1 fold items and the six second-round findings were verified, each with a guard that goes red on revert (reviews/premerge-r3-verify.md). The supervision binary then passed 30 runs without a failure, half of them under load.'
