    reason: 'The #4 code has STALE_BADGE typed StateBadge with the same literal as STALENESS_BADGE, LANE_COUNT_TEXT and SUBTASK_PROGRESS_TEXT, and StateBadge/BadgeTone. The new defaults.md duplicates the first three and returns tone: string. No Dependencies on #4 entry in plan.md names any of them. The PROGRESS_LABEL_SUBTASKS equivalence is plausible but not provable from the text. Severity 3 is acceptable.'
  - id: PLAN-ARCH-003
