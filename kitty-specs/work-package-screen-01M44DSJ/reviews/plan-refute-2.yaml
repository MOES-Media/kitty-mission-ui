    reason: 'defaults.md types filesView(files: ResolvedFile[]) and calls the constant UNKNOWN_CHANGE_STATE. data-model.md names the derived type RenderedFile and the key UNKNOWN. ChangeStateView is defined but WorkPackageDetailView does not use it, and STALENESS_STATUS_ROLE has no stated result for an unknown status. Severity 2 is right.'
  - id: PLAN-CORRECT-015
    verdict: confirmed
    reason: 'research D-12 limits E-17 to history-parts.ts and facts-parts.ts. gates.md E-17 adds work-parts.ts, and the contract puts the Workspace region in work-parts.ts. The two documents therefore present different exception scopes. The tracer-design-decisions.md G-10 citation did not check out (grep found no G-10 there), but the research/gates mismatch holds, so the principal claim stands. Severity 2 is right.'
  - id: PLAN-ARCH-002
