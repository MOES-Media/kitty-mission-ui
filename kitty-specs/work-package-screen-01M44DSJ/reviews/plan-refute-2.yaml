    reason: 'In #4 the screen imports the library sheets and composes the parts files styles, and library-sheets.ts has no facts or event-timeline sheet. The Shared files table has no library-sheets.ts row, and IC-03b ships only empty panels and stubs. Research G-09/G-10 put the adopted sheets in the parts files while gates.md E-17 puts them in library-sheets.ts. The wiring has no owner, so severity 4 is right.'

