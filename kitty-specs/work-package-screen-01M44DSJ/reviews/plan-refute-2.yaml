    reason: 'plan.md line 104 lists only check.test.mjs and overlays.test.mjs, yet registry.test.mjs hard-codes 22 fixtures and the 15/4/3 kind split. checkPin already compares PIN.files with the directory, so a count derived from Object.keys(PIN.files) adds no independent guard. Severity 3 is right.'
  - id: PLAN-CORRECT-011
    verdict: confirmed
    reason: 'The Shared files table says IC-03b writes literal dispatchEvent calls, but also that IC-07 writes the event methods in the screen file. The IC-04, IC-05 and IC-06 traceability rows name EV-4, EV-6, EV-1 and EV-5 tests, and IC-04 to IC-06 are not downstream of IC-07. The ownership contradiction is real, severity 3.'
  - id: PLAN-CORRECT-012
    verdict: confirmed
    reason: 'D-15 and the story catalogue make every baseline a whole-screen shellFrame capture. IC-03b leaves the regions as titled empty panels, so each region WP changes earlier owners PNGs. The plan lets only the title owner touch a baseline and IC-08 edit only its own stories, so nobody owns regeneration. This is a real fork, and severity 4 is defensible.'
  - id: PLAN-CORRECT-013
    verdict: confirmed
    reason: 'contract-pin.md records branch "mission-status-contract-1-1-01M42XJC", the mission slug. The lane checkout is on kitty/mission-mission-status-contract-1-1-01M42XJC-lane-a, tip 80840298d, and no branch with the recorded name exists. Severity 2 is right.'
  - id: PLAN-CORRECT-014
