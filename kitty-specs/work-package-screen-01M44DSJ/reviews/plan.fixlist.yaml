    it from the pin.

    [merged PLAN-VERIFY-005] Keep literal expected counts in the positive control (150 vendored files, 22+47=69 fixtures, the new kind split) and update them deliberately at the re-pin. Add a presence check
    for named anchor files (openapi.yaml, WorkPackageDetail.yaml, ReviewCycle.yaml, Workspace.yaml and their examples). Build the negative test from a dropped key as today. List all three test files in
    the IC-01 scope and revert checks.'
  merged_from:
  - PLAN-VERIFY-005
  refuter_reason: plan.md line 104 lists only check.test.mjs and overlays.test.mjs, yet registry.test.mjs hard-codes 22 fixtures and the 15/4/3 kind split. checkPin already compares PIN.files with the directory,
    so a count derived from Object.keys(PIN.files) adds no independent guard. Severity 3 is right.
  fork: false
- id: PLAN-CORRECT-011
  lens: Spec fidelity
  severity: 3
  title: Event dispatch ownership is contradictory, and IC-04 to IC-06 cannot pass their EV tests before IC-07
  evidence:
  - artifact: "plan.md \xA7 Shared files (index.ts row: IC-03b writes literal dispatchEvent calls; sk-work-package-screen.ts row: IC-07 afterwards 'for the status switch and the event methods only'); \xA7\
      \ Traceability (FR-002, FR-003 EV-4 test in IC-04; FR-008 to FR-010 EV-1; FR-015 to FR-017 EV-5; FR-013, FR-014 EV-6)"
  - artifact: spec.md FR-035 (tests for every event and payload with positive controls)
  - artifact: "plan.md \xA7 Shared files row 1 (IC-03b writes 'literal dispatchEvent calls') versus row 2 (IC-07 writes 'the event methods only'); \xA7 IC-06 (EV-1 proof via traceability FR-008..010); \xA7\
      \ IC-04 (EV-4 via FR-003); \xA7 IC-05 (EV-6); \xA7 Traceability"
  - artifact: research.md D-04 (every dispatch is a literal in the screen file, parts get a handler passed in)
  claim: 'The crumb event (EV-4), Open review (EV-6), dependency nodes (EV-1) and artifact links (EV-5) belong to IC-04, IC-05 and IC-06, whose tests assert them. The event methods are written by IC-07,
    the last WP of chain Y, and IC-04/IC-05 are not downstream of IC-07. The plan says both that IC-03b writes the literal dispatch calls and that IC-07 writes the event methods. A WP agent cannot meet
    its own exit test, or edits a file it does not own.

    [merged PLAN-ARCH-004] The crumb (EV-4), the ''Open review'' link (EV-6), the dependency node (EV-1) and the Open spec / Open prompt links (EV-5) are drawn by IC-04, IC-05 and IC-06, but their dispatch
    methods are written by IC-03b or IC-07 (ambiguous). IC-07 comes last in chain Y, so IC-06''s ''EV-1 test'' and IC-04''s ''EV-4 test'' have no event to assert when those WPs are reviewed. The spec requires
    each event to be asserted with a positive control. The text also leaves open whether the surface freeze includes the dispatch bodies.'
  remediation: 'Give IC-03b all four typed dispatch methods (payload built from mission, wpId and the activated item, one literal dispatch site each, @fires declared), with parts receiving callbacks or
    calling the host element''s methods. Restrict IC-07 to the status and detailStatus switch and the retry wiring tests. Update the Shared files row and the Traceability proofs accordingly.

    [merged PLAN-ARCH-004] State once that IC-03b writes all four dispatch methods (payload builders come from IC-02''s `retryDetail` plus small literal builders, with `@fires`) as part of the frozen surface.
    IC-07 keeps only the status switch and the regional-notice logic. Part files receive the handlers as arguments. Each region WP then owns and runs its own event test.'
  merged_from:
  - PLAN-ARCH-004
  refuter_reason: The Shared files table says IC-03b writes literal dispatchEvent calls, but also that IC-07 writes the event methods in the screen file. The IC-04, IC-05 and IC-06 traceability rows name
    EV-4, EV-6, EV-1 and EV-5 tests, and IC-04 to IC-06 are not downstream of IC-07. The ownership contradiction is real, severity 3.
  fork: false
