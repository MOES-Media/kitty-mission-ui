- id: PLAN-ARCH-002
  lens: Reuse and single source of truth
  severity: 3
  title: 'Several new defaults and one type repeat what #4 already ships, giving a second source for the same word or tone'
  evidence:
  - artifact: "contracts/defaults.md \xA7 defaults/staleness.ts (STALENESS_BADGE), \xA7 defaults/wp-copy.ts (workPackageCountText, PROGRESS_LABEL_SUBTASKS), \xA7 logic additions (resolveVerdict / resolveChangeState\
      \ return { word: string; tone: string })"
  - code: '<#4>/packages/mission-ui/src/defaults/lifecycle.ts: STALE_BADGE = { label: ''stale'', tone: ''info'' }'
  - code: '<#4>/packages/mission-ui/src/defaults/lanes.ts: LANE_COUNT_TEXT (1 Work Package / N Work Packages), SUBTASK_PROGRESS_TEXT(done, total)'
  - code: '<#4>/packages/mission-ui/src/logic/types.ts: StateBadge { label, tone: BadgeTone }, BadgeTone'
  claim: '(a) `STALENESS_BADGE` is the same literal as #4''s `STALE_BADGE`, so the word ''stale'' and its tone would have two homes. (b) `workPackageCountText(n)` duplicates `LANE_COUNT_TEXT`. (c) `PROGRESS_LABEL_SUBTASKS`
    duplicates `SUBTASK_PROGRESS_TEXT`. (d) The new resolvers return `tone: string`, a second, untyped tone vocabulary next to #4''s `StateBadge` / `BadgeTone`. A string tone also needs a cast before it
    reaches `sk-pill-tag`. The plan''s ''Dependencies on #4'' list names none of these.'
