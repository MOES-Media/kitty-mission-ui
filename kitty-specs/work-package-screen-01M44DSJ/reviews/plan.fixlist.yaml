- id: PLAN-CORRECT-001
  lens: Data model and event typing
  severity: 4
  title: The new view type WorkPackageView collides with
  evidence:
  - artifact: "data-model.md \xA7 Widened view types (WorkPackageView); research.md \xA7 D-06; contracts/sk-work-package-screen.md \xA7 Properties (workPackage)"
  - code: 'pr6-folds/packages/mission-ui/src/contract/types.ts: export type WorkPackageView = Omit<WorkPackageSummary, ''statusLane''> & { statusLane: string | null; actor?: string }'
  - code: pr6-folds/packages/mission-ui/src/{index.ts, logic/types.ts, logic/placement.ts, elements/sk-work-package-board/sk-work-package-board.ts, elements/sk-work-package-board/fixtures.ts} all import
      or re-export that name
  - artifact: "data-model.md \xA7 Widened view types (WorkPackageView); research.md D-06; plan.md IC-01 (view types in src/contract/types.ts)"
  - code: '<#4>/packages/mission-ui/src/contract/types.ts: `export type WorkPackageView = Omit<WorkPackageSummary, ''statusLane''> & { statusLane: string | null; actor?: string }`'
  - code: '<#4>/packages/mission-ui/src/logic/types.ts: PlacedCard.wp: WorkPackageView; contract/types.ts MissionDetailView.workPackages: WorkPackageView[]'
  claim: '#4 already exports WorkPackageView, the widened WorkPackageSummary of the Pipeline board. The plan defines a different WorkPackageView, a widened full WorkPackage, in the same file (src/contract/types.ts,
    "this mission adds the names below"). Adding it is a duplicate declaration (TS2300). Redefining it would change the board''s and placement''s input type and the public export. The ''host'' fixture kinds
    also emit `satisfies WorkPackageView`, so the generated fixtures file would bind to the wrong type.

    [merged PLAN-ARCH-001] #4 already exports `WorkPackageView` from src/contract/types.ts (a widened WorkPackageSummary with a host `actor?: string`, used by the board, PlacedCard and MissionDetailView).
    The plan defines a second `WorkPackageView` in the same file, built on the 1.0 `WorkPackage`. IC-01 either breaks every #4 consumer or cannot add the type. `WorkPackageDetailView`, `HistoryEntryView`,
    `SubtaskView` and `DependencyRefView` have no collision. The contracts and data-model also use the name `WorkPackageView` for the screen''s `workPackage` property and for `resolveLists` / `historyView`
    signatures.'
  remediation: 'Rename the new type in data-model.md, research D-06, the element contract and contract-pin.md to a non-colliding name (for example WorkPackageFullView, with WorkPackageDetailView unchanged).
    Add a line to plan.md "Dependencies on #4" saying #4''s WorkPackageView stays untouched. The registry `satisfies` targets for the new host and relaxed fixtures use the new name.

    [merged PLAN-ARCH-001] Rename the new type everywhere in plan, data-model, contracts/sk-work-package-screen.md and contracts/defaults.md (for example `WorkPackageRecordView`). Add to the IC-01 exit
    checks that #4''s `WorkPackageView` stays unchanged and that `tsc` is green for the board and Pipeline screens.'
  merged_from:
  - PLAN-ARCH-001
  refuter_reason: pr6-folds contract/types.ts line 25 already exports WorkPackageView as a widened WorkPackageSummary (used at line 30 by MissionDetailView.workPackages), while data-model.md line 20 defines
    a different WorkPackageView in the same file.
  fork: false
- id: PLAN-CORRECT-002
  lens: Contract fidelity
  severity: 4
  title: wpUnknownLane and detailUnknownLanes name a "lane-open" relaxation that does not exist for WorkPackage or WorkPackageDetail
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 Fixture inventory (wpUnknownLane, detailUnknownLanes: relaxed lane-open, reuses #4's name and proof); research.md \xA7 D-10"
  - code: 'pr6-folds/scripts/contract/registry.mjs: RELAXATIONS[''lane-open''] = { schema: ''MissionDetail'', allowedPath: /^\/workPackages\/\d+\/statusLane$/, patch() reads schema.allOf.find(x => x.properties.workPackages)
      }'
  - code: 'pr6-folds/scripts/contract/check.mjs: checkFixtureDoc, ''relaxed'' branch compiles relaxedSchema(pristine, RELAXATIONS[def.relaxation]) against def.schema'
  - code: 'lane contracts/mission-status/schemas/WorkPackage.yaml: statusLane is oneOf [StatusLane, null]; history items fromStatusLane/toStatusLane; schemas/Subtask.yaml and DependencyRef.yaml statusLane'
  - artifact: 'contracts/contract-pin.md rows wpUnknownLane and detailUnknownLanes (''relaxed lane-open (reuses #4''s name and proof)''); research.md D-10'
  - code: '<4>/scripts/contract/registry.mjs: RELAXATIONS[''lane-open''] has schema MissionDetail, allowedPath /^\/workPackages\/\d+\/statusLane$/ and a patch that walks schema.allOf for properties.workPackages'
  - code: '<4>/scripts/contract/check.mjs: checkFixtureDoc applies relaxedSchema(pristine, RELAXATIONS[name]) to def.schema, and rejects strict errors outside allowedPath'
  claim: 'The existing ''lane-open'' relaxation patches MissionDetail.workPackages[].statusLane and allows only paths under /workPackages/N/statusLane. WorkPackage and WorkPackageDetail are different schemas
    with no allOf or workPackages member, so applying it throws in patch() and the gate fails closed. The needed patches are different: WorkPackage.statusLane plus history[].fromStatusLane and toStatusLane,
    and Subtask.statusLane plus DependencyRef.statusLane. Their allowedPath patterns are different too. The plan says "reuses #4''s name and proof" and declares no new relaxation entries, schemas, patches
    or reverted-must-fail proofs. This is the undeclared relaxation the lens asks about.

    [merged PLAN-VERIFY-002] The existing lane-open patch looks for allOf and workPackages, which WorkPackage and WorkPackageDetail do not have, so applying it throws or relaxes nothing. Its allowedPath
    only admits /workPackages/N/statusLane, so history/N/*StatusLane, subtasks/N/statusLane and dependencies/N/statusLane are reported as ''deviates outside''. The unknown-lane fixtures (WP-45, SC-003,
    FR-023) cannot pass the contract gate as planned, and no proof test is planned for the new relaxations.'
  remediation: 'Declare in contract-pin.md two new named relaxations (for example ''wp-lane-open'' on schema WorkPackage and ''detail-lane-open'' on WorkPackageDetail). Give each its patch, its allowedPath
    regex, and its check.test.mjs proof (a strict failure confined to the allowed paths; reverting the patch makes the fixture fail). Say that RELAXATIONS entries now carry their own schema and that check.mjs
    asserts def.schema equals RELAXATIONS[rel].schema.

    [merged PLAN-VERIFY-002] Add new named relaxations, for example wp-lane-open (WorkPackage: statusLane, history items fromStatusLane and toStatusLane become string or null) and detail-lane-open (Subtask.statusLane,
    DependencyRef.statusLane). Each needs its own allowedPath and a reverted-must-fail proof in check.test.mjs. Fix contract-pin.md and research D-10 to say ''new relaxations modelled on lane-open''. Update
    the relaxed-count assertion in registry.test.mjs.'
  merged_from:
  - PLAN-VERIFY-002
  refuter_reason: RELAXATIONS lane-open in registry.mjs is bound to schema MissionDetail, patches via schema.allOf and workPackages, and allows only /workPackages/N/statusLane; contract-pin.md lines 91
    and 115 reuse it for WorkPackage and WorkPackageDetail fixtures, so the patch would throw or the allowedPath would reject history, subtask and dependency lanes.
  fork: false
- id: PLAN-CORRECT-005
  lens: Contract fidelity
  severity: 3
  title: detailWorkspaceAllNull is described as "laneId the only non-null member", which is neither all-null nor a valid reading of the schema, and it duplicates detailNullWorkspace
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 WorkPackageDetail fixtures (detailNullWorkspace; detailWorkspaceAllNull: \"laneId the only non-null member ... if the schema requires laneId non-null\"); spec.md\
      \ WP-32, WP-33"
  - code: 'lane contracts/mission-status/schemas/Workspace.yaml: laneId, laneBranch and planningBranch are all type [string, null]; worktreePresent boolean'
  - code: 'lane contracts/mission-status/examples/WorkPackageDetail.null-workspace.yaml: laneId null, laneBranch null, planningBranch null, worktreePresent false'
  - artifact: 'contracts/contract-pin.md rows detailNullWorkspace (WP-32), detailWorkspaceAllNull (WP-33b: ''laneId the only non-null member as the contract allows ... if the schema requires laneId non-null'')'
  - code: '<lane-1.1>/schemas/Workspace.yaml: laneId is string or null (nullable); examples/WorkPackageDetail.null-workspace.yaml is all-null with worktreePresent false'
  claim: 'The schema lets laneId be null, so the hedge is unnecessary. The example WorkPackageDetail.null-workspace is already the all-null "no lanes" workspace that spec row WP-33 (all-null) needs. detailWorkspaceAllNull,
    as written, is a lane-planning variant with only laneId set. WP-32 (worktreePresent false with a lane present, and "no claim that it was removed", R-4) is mapped to detailNullWorkspace, which has no
    lane at all. So WP-32 and WP-33b would render nearly the same workspace and the R-4 case would never be shown.

    [merged PLAN-VERIFY-020] laneId is nullable, so the hedge is moot. The all-null workspace is exactly the null-workspace example already used for WP-32, so WP-32 and WP-33b are the same data and give
    two identical baselines. The intended WP-32 case (a lane present, worktreePresent false, where the ''removed'' claim must not appear, R-4) is never exercised.'
  remediation: 'Map WP-33b to detailNullWorkspace and delete detailWorkspaceAllNull (46 detail fixtures become 19, total new 46). Add a WP-32 fixture overlay (for example detailWorkspaceNoWorktree, from
    detailPopulated with worktreePresent false and a lane set) or reuse the workspace of the unparseable-cycle example. Update the row-to-fixture table, the counts (47, 56 stories unchanged) and the story
    catalogue.

    [merged PLAN-VERIFY-020] Use an overlay with laneId lane-a, a lane branch and worktreePresent false for WP-32. Keep null-workspace for WP-33b and delete the hedge text. Assert in the WP-32 test that
    no word implying removal appears.'
  merged_from:
  - PLAN-VERIFY-020
  refuter_reason: Workspace.laneId is nullable, so the contract-pin.md line 101 hedge is moot; WP-32 and WP-33b both end up as the all-null workspace (null-workspace example), and no fixture shows a lane
    present with worktreePresent false (R-4). Severity 3 is right.
  fork: false
- id: PLAN-CORRECT-006
  lens: Spec fidelity
  severity: 3
  title: WP-13 (blocked dependencies) has no detail fixture whose dependencies are unsatisfied
  evidence:
  - artifact: "contracts/sk-work-package-screen.md \xA7 Story catalogue (WP-13 `wpBlocked` + deps); contracts/contract-pin.md (wpBlocked: readiness unsatisfied, two ids; detailPopulated has one dependency)"
  - code: 'lane contracts/mission-status/examples/WorkPackageDetail.populated.yaml: dependencies: one entry, WP03, statusLane approved'
  claim: The pass condition of WP-13 is titled dependency nodes with lane words and the unsatisfied ones marked in words, with two unsatisfied ids from wpBlocked. The only detail fixtures with dependencies
    are detailPopulated (one dependency, approved, i.e. satisfied) and detailDepNullLane. Pairing wpBlocked with detailPopulated puts readiness.unsatisfied ids that are not in detail.dependencies, and a
    satisfied dependency that nothing marks. The "marked unsatisfied" behaviour of FR-009 is therefore not exercised by consistent data.
  remediation: Add a fixture to the inventory, for example detailDepsBlocked (two dependencies with titles and lanes planned and in_progress, ids equal to wpBlocked.readiness.unsatisfied), and use it for
    WP-13. Make wpBlocked.dependencies carry the same two ids. Update the fixture count (the inventory and the guard literal change by one).
  refuter_reason: WP-13 maps to wpBlocked plus detailPopulated, whose only dependency is WP03 with statusLane approved, so wpBlocked's two unsatisfied ids are not in detail.dependencies and no unsatisfied
    dependency is shown consistently. Severity 3 is right.
  fork: false
- id: PLAN-CORRECT-007
  lens: Contract fidelity
  severity: 3
  title: Fixture pairing and overlays leave wpId, statusLane and history inconsistent; the 'same wpId' node test cannot pass as specified
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 Fixture inventory (wpPopulated 'set to in_progress', wpReviewNone, wpApproved, wpChangesRequested, wpDone) and last paragraph (host compositions, node test\
      \ that both fixtures agree on wpId, none deliberate)"
  - code: 'lane examples: WorkPackage.populated wpId WP04, statusLane for_review, history last entry to for_review; WorkPackageDetail.populated WP04; null-workspace WP01; no-cycles WP02; planning-lane WP06;
      unknown-change-state WP05; unparseable-cycle WP03; WorkPackage.actor-handle WP02, actor-redacted WP03'
  claim: The detail examples carry fixed wpIds (WP01 to WP06) that differ from the WorkPackage overlay bases (WP04, WP07, WP08 and so on). Stories such as WP-29 (detailNoCycles WP02), WP-32/33 (WP01, WP06)
    and WP-35b (WP03) need a WorkPackage with the same wpId, and the inventory declares no wpId overlay, so the node test will fail or the pairs will be invented ad hoc. Separately, overlays that change
    statusLane (wpPopulated to in_progress, wpChangesRequested, wpApproved, wpReviewNone) do not say they rewrite history. The base history ends at for_review, so the story would show header "approved"
    or "in progress" while the newest history entry (the one marked "Current", Q12) says for_review. The contract has no WorkPackage coherence rule, so only the overlay text can prevent this.
  remediation: State in contract-pin.md (a) a pairing table per story, with the wpId overlay applied to the WorkPackage side (or the detail side) for every pair, and (b) for every overlay that changes statusLane,
    the history, subtaskProgress and subtasks entries it rewrites, so the last history entry's toStatusLane equals statusLane. Add the pairing table to the IC-09 node test's input.
  refuter_reason: Detail examples carry wpIds WP01 to WP06 against WorkPackage bases WP04, WP07 to WP10 and others, contract-pin.md line 120 asserts same-wpId pairs but declares no wpId overlay, and overlays
    such as wpApproved and wpChangesRequested change statusLane without saying they rewrite history (the base ends at for_review). Severity 3 is right.
  fork: false
- id: PLAN-CORRECT-009
  lens: Vendoring mechanics
  severity: 3
  title: Vendoring test updates miss registry.test.mjs and several literals, and the pin-derived file-count guard is vacuous
  evidence:
  - artifact: "plan.md \xA7 Source code (check.test.mjs overlays.test.mjs only) and \xA7 IC-01; contracts/contract-pin.md \xA7 Gate contract change (98-file guard becomes Object.keys(PIN.files).length vs\
      \ the directory); research.md \xA7 D-09 item 5"
  - code: 'pr6-folds/scripts/contract/check.test.mjs: positive control asserts summary.vendoredFiles === 98 and summary.fixtures === 22; guard tests use ''registry of 21 entries against 22 exports'' and
      ''PIN.files of 97 keys against 98 files'''
  - code: 'pr6-folds/scripts/contract/registry.test.mjs: ''the inventory has 22 fixtures: 15 valid, 4 host, 3 relaxed'' and kinds.length 22; overlays.test.mjs: Object.keys(fixtures).length 22'
  - code: 'pr6-folds/scripts/contract/check.mjs: checkPin already compares PIN.files with the directory (file set)'
  - artifact: contracts/contract-pin.md, C8 paragraph ('the 98-file guard becomes a comparison of Object.keys(PIN.files).length with the directory'); plan.md IC-01
  - code: '<4>/scripts/contract/check.mjs: checkPin already reports extra and missing files between PIN.files and the directory; its only count guard is ''no vendored files'''
  - code: '<4>/scripts/contract/check.test.mjs: positive control asserts vendoredFiles 98, fixtures 22, bulkPages 2; the 97-key guard test'
  - code: '<4>/scripts/contract/overlays.test.mjs and registry.test.mjs: assert 22 fixtures and the 15 valid, 4 host, 3 relaxed split'
  claim: 'registry.test.mjs hard-codes 22 entries and a kind tally (15/4/3). It is not in the plan''s file list and will fail once 47 entries (with new host and relaxed kinds) are added. The plan names
    only the 98 guard. A guard computed from Object.keys(PIN.files) compared with the directory is the file-set check C1 already performs, so it cannot catch the failure it exists for (a wrong or emptied
    vendoring where pin and directory shrink together).

    [merged PLAN-VERIFY-005] The 98 and 22 literals in the tests are the independent anti-vacuity guard. Comparing the pin''s key count with the directory repeats what checkPin already does. If a --from-repo
    or re-pin read returns a subset, the pin and the directory shrink together and the guard stays green, which is exactly the vacuity it exists to stop. The plan names only check.test.mjs for the fixture
    count, but overlays.test.mjs and registry.test.mjs also pin 22 and the kind split, so they go red unexplained.'
  remediation: 'Add scripts/contract/registry.test.mjs to IC-01''s owned files and list the literals to update (22, 15/4/3 tally, 98, 21/22, 97/98) in IC-01 and in the exit checks. Keep an independent literal
