  evidence:
  - artifact: "plan.md \xA7 Architecture (content width table: three columns at 1100 px and above); research.md D-13; spec.md FR-029, DW-24 (keep, same behaviour), WP-46 to WP-48"
  - code: '<prototype>/04-work-package.html + prototype.css: .detail-grid (3 tracks), @media (max-width:1100px) two columns, @media (max-width:800px) one column. These are VIEWPORT queries; the prototype
      app-shell takes 56 px rail + 240 px sidebar from the viewport (--sk-layout-personal-rail-width 3.5rem, --sk-layout-context-sidebar-width 15rem).'
  - code: 'pr6-folds/packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts: EXPANDED_QUERY ''(min-width: 1100px)'', COLLAPSED_QUERY ''(min-width: 720px)''; expanded mission layout grid is
      rail + sidebar + minmax(0,1fr); flush removes the main padding'
  claim: The plan turns the prototype's viewport breakpoints (1100, 800) into container-width breakpoints of the same numbers. In the real shell the content cell is the viewport minus 296 px (expanded)
    or minus 112 px (collapsed). At the 1280 px viewport of 50 of the 56 stories the content cell is about 984 px, so the plan's table gives two columns where the prototype at 1280 shows three. At the 1100
    px story the cell is about 804 px (only 4 px above the 800 one-column threshold, so the baseline sits on a knife edge); the 800 px and 620 px stories happen to land correctly. Operator-confirmed DW-24
    says "same breakpoints and behaviour, keep", so this is unregistered drift in every 1280 baseline. Spike S8 would expose it, but the plan states the wrong thresholds as the design and E-19 pins the
    lengths 1100/800/620 px. WP-46 also calls 1100 px the "collapsed tier", but at 1100 px the shell is in its expanded tier (collapsed is 720 to 1099).
  remediation: 'FORK: pick one and state it in plan.md, research.md D-13, DW-24, E-19 and the WP-46 to WP-48 rows. (a) Keep container queries but derive the container thresholds from the shell''s real content
    widths so each viewport tier yields the prototype''s columns (for example three columns from about 805 px content, one column below about 690 px; prove with S8 at 1280/1100/800/620 and change the E-19
    lengths accordingly). (b) Keep the numbers 1100/800/620 as VIEWPORT media conditions (the screen then follows the window, not its cell; amend D-13 and the #4 D-30 reasoning). (c) Register the content-width
    semantics as a new drift item for CP-1 and re-baseline expectations (three columns appear only at a content cell of 1100 px or wider; the 1280 px stories would show two). In every case add an acceptance
    check that the 1280 px story has three columns and fix the "collapsed tier" wording of WP-46.'
  refuter_reason: prototype.css uses viewport @media 1100/800 but plan.md table and E-19 use the same numbers as container widths, so the 1280 stories (content cell about 984 px) get two columns while the
