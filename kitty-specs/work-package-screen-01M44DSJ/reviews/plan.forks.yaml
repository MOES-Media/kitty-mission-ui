- id: PLAN-ARCH-006
  lens: Dynamic-pipeline constraint
  severity: 4
  title: The data-driven gate does not cover the new vocabularies the plan says it covers, and the two new self-test fixtures are vacuous
  evidence:
  - artifact: "plan.md \xA7 Summary / Charter Check ('existing data-driven gate applies, extended only by self-test cases'); research.md D-07, D-11, R-04; contracts/gates.md \xA7 How each gate applies (data-driven\
      \ row), \xA7 Self-check list"
  - code: '<#4>/eslint.data-driven.config.mjs: WORDS = MissionPhase.name enum + StatusLane enum; STATUS_WORDS = pending, complete, draft, discarded; UNDERSCORED = in_progress, for_review, in_review; IDENT_WORDS
      excludes review and done; S1 flags any Literal equal to a WORD outside the allow-list'
  - code: <contract 1.1>/schemas/StatusLane.yaml (approved is a lane), ReviewVerdict.yaml (approved, changes_requested), ChangeState.yaml (changed, unchanged, unknown), Staleness.yaml status enum (fresh,
      stale, not_applicable)
  - artifact: contracts/gates.md, data-driven row (fixtures 1 and 2; words join the list ONLY if a fixture shows an escape); plan.md IC-02 exit check 'each new case red without its fix'; research.md D-07
  - code: '<4>/eslint.data-driven.config.mjs: WORDS = MissionPhase names plus the nine StatusLane values (approved is already a lane); STATUS_WORDS = pending, complete, draft, discarded; UNDERSCORED = in_progress,
      for_review, in_review'
  - code: '<4>/gates/fixtures/data-driven/s1-comparison.ts.txt: an existing positive fixture already covers a comparison with a lane literal (S1)'
  - code: '<4>/gates/data-driven.selftest.ts: counts pinned (36 positives, readdir 36, 14 words, 31 entries)'
  claim: 'Only `approved` is already a gate word (S1, because it is a lane). So self-test fixture (1), a verdict compared with ''approved'', is red today without any change, and fixture (2), a history marker
    keyed on a lane value, is also S1. The exit check ''each new case red without its fix'' therefore proves nothing. The words that really are new (`changes_requested`, `fresh`, `stale`, `not_applicable`,
    `changed`, `unchanged`, `unknown`, `not_found`, `source_unreadable`) are matched by no selector, so `=== ''stale''` or `''changes_requested''` outside defaults/ passes the gate. The plan relies on a
    reviewer checklist, and D-07 says words are added only if a fixture shows an escape, but no fixture tests an escape. Lane-freedom of ''Current on the last array element'' is fine: S8/S9 key on `phases`
    only and the history is positional.

    [merged PLAN-VERIFY-003] Fixture 1 (a comparison with ''approved'') and fixture 2 (a marker keyed on a lane value) are both already reported by S1 or S5, so they pass today with no gate change. They
    duplicate existing coverage and cannot be ''red without the fix'' because no fix exists. The real hazard is the words the gate does not know: changes_requested, fresh, stale, not_applicable, changed,
    unchanged and unknown. A part that writes === ''changes_requested'' or === ''stale'' passes the gate. gates.md says words are added only if a fixture shows an escape, but the chosen fixtures can never
    show one. FR-023 and NFR-009 for the new vocabularies are enforced only by the reviewer self-check list.'
  remediation: 'FORK. (A) Extend `eslint.data-driven.config.mjs` to read the verdict, change-state and staleness-status enums from the vendored schemas as it already does for lanes. Add `changes_requested`,
    `not_applicable` and `unchanged` to the underscored or whole-word lists and handle the false-positive risk of bare `unknown`, `changed`, `fresh`, `stale` (restrict to comparisons and case labels). Add
    positive fixtures per new word, update EXPECTED_WORDS and the count guards, and make each new fixture red before the config change. (B) Leave the gate as is, drop the claim that it covers the new vocabularies,
    and add a node test that scans the new logic and part files for these literals; plan fixtures (1) and (2) as non-vacuous only for what S1 already catches. Whichever is chosen, rewrite the plan so the
    self-test fixtures target a word that is red without the change.

    [merged PLAN-VERIFY-003] FORK: (a) extend the gate: read the verdict, change-state and staleness enums (ReviewVerdict.yaml, ChangeState.yaml, Staleness.yaml status and reason) from the vendored schemas
    the way LANES is read. Replace fixture 1 with comparisons against each new word, update EXPECTED_WORDS, the word-count test, the 36 and 38 counts and the ''covers every selector'' test in the same change.
    I grepped #4''s packages/*/src outside the allow-list and found no existing literal of these words, so a collision is unlikely; the self-test will confirm. (b) Keep the gate as is, state in gates.md
    that the new vocabularies are review and behavioural-test only, drop the two fixtures and the ''red without its fix'' exit check, and rely on the foreign-vocabulary tests of PLAN-VERIFY-009.'
  merged_from:
  - PLAN-VERIFY-003
  refuter_reason: 'approved is in StatusLane so S1 already flags it (and #4 has s1-comparison fixture), making fixture 1 vacuous; changes_requested, fresh, stale, not_applicable, changed, unchanged and
    unknown match no WORDS, STATUS_WORDS or UNDERSCORED entry in eslint.data-driven.config.mjs; severity 4 is right.'
  fork: true
