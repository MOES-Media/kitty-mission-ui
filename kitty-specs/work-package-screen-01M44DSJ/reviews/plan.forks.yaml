- id: PLAN-CORRECT-012
  lens: Spec fidelity
  severity: 4
  title: Baselines of the ready-state stories of earlier WPs go stale when later WPs add regions, and no WP owns their regeneration
  evidence:
  - artifact: "plan.md \xA7 IC-04 (WP-01, 09, 17 to 22, 38 baselines), IC-05, IC-06, IC-09 (five clean visual runs), \xA7 Shared files (stories and baselines: the WP that owns the story title)"
  - artifact: spec.md FR-036 and NFR-002 (every baseline stable across 5 runs; each row shows the whole screen in the shell)
  - artifact: 'plan.md, Shared files row ''stories and baselines: the WP that owns the story title; disjoint names''; IC-03b (''titled empty panels''); IC-04 to IC-08; IC-09 (five clean visual runs)'
  - artifact: 'contracts/sk-work-package-screen.md, Story catalogue: every story is the whole screen inside shellFrame; WP-01 (owned by IC-04) requires history, chains, workspace and links to show'
  - code: '<4>/kitty-specs/missions-and-pipeline-screens-01M40SKZ/plan.md: #4 had one work package per screen, so the problem did not arise there'
  claim: 'Every ready-state story renders all regions. IC-04''s ten stories are approved while history, review, chains, subtasks, files and workspace (IC-05, IC-06, IC-07) are still titled empty panels,
    so their PNGs change when those WPs land. The same is true of chain X versus chain Y stories. IC-08 edits only its own stories and IC-09''s five clean runs would then fail or force a WP to rewrite baselines
    it does not own.

    [merged PLAN-VERIFY-004] Each baseline is a full-screen capture. The IC-04 stories (WP-01 and others) are captured with empty titled panels for history, review, chains and subtasks. When IC-05 or IC-06
    fills those panels, every IC-04 PNG changes. Chains X and Y run in parallel lanes and each sees the other''s panels empty, so after the IC-08 merge every baseline differs from what its owner committed.
    The plan lets only the title owner regenerate a baseline and has IC-08 edit only its own stories. Either every later WP fails its own pnpm visual on other owners'' stories, or someone silently regenerates
    them. NFR-002, SC-006 and NFR-008 cannot be demonstrated until this is settled.'
  remediation: 'FORK, orchestrator to rule. (a) Give IC-09 an explicit step and ownership exception to regenerate every ready-state baseline after IC-08 and have a reviewer check each against the prototype;
    IC-04 to IC-07 commit stories and tests but no PNG for stories that show regions they do not own. (b) Each region WP commits baselines only for its own region stories rendered with the other regions
    still empty and the final integration baselines are IC-09''s. Say which, and adjust "stories and baselines" in the Shared files table.

    [merged PLAN-VERIFY-004] FORK: (a) commit baselines only in IC-09, after the chains are merged, with each WP checking its stories by uncommitted screenshots against the prototype. (b) Let any WP regenerate
    any baseline its change alters, record the list in its hand-off, and make the IC-08 merge resolve PNG conflicts by regeneration, with a reviewer check that no baseline changed for a reason outside the
    WP diff. (c) Make the story owner the last WP that touches the screen''s rendering of that story, regenerated at IC-09. State the chosen rule in plan.md Shared files and the WP brief rules.'
  merged_from:
  - PLAN-VERIFY-004
  refuter_reason: D-15 and the story catalogue make every baseline a whole-screen shellFrame capture. IC-03b leaves the regions as titled empty panels, so each region WP changes earlier owners PNGs. The
    plan lets only the title owner touch a baseline and IC-08 edit only its own stories, so nobody owns regeneration. This is a real fork, and severity 4 is defensible.
  fork: true
