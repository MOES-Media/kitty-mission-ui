- id: PLAN-CORRECT-003
  lens: Vendoring mechanics
  severity: 4
  title: '''host'' fixtures that omit staleness, reviewCycles or workspace cannot validate; stripHost only removes fields and cannot restore a required one'
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 Fixture inventory (wpStalenessOmitted and detailOmittedProvisional are Kind host; \"registry strips before validation\")"
  - code: 'pr6-folds/scripts/contract/validate.mjs: stripHost deletes only `stale` (document and items) and `actor` (workPackages[])'
  - code: 'pr6-folds/scripts/contract/check.mjs: checkFixtureDoc ''host'' branch validates stripHost(doc) against the strict schema'
  - code: lane schemas/WorkPackage.yaml required includes staleness; schemas/WorkPackageDetail.yaml required includes reviewCycles and workspace
  - artifact: contracts/contract-pin.md, fixture inventory rows wpStalenessOmitted and detailOmittedProvisional (kind host, 'registry strips before validation')
  - code: '<4>/scripts/contract/validate.mjs: stripHost only deletes the host-only extra fields stale (overview or page) and actor (on doc.workPackages entries); it cannot restore a removed member'
  - code: '<4>/scripts/contract/check.mjs: checkFixtureDoc validates a host fixture against the STRICT schema after stripHost'
  - code: '<lane-1.1>/schemas/WorkPackage.yaml: required includes staleness; schemas/WorkPackageDetail.yaml: required includes reviewCycles and workspace'
  claim: 'All three members are required in the closed 1.1 schemas. A document with the property omitted fails the ''required'' keyword after stripHost, because stripping removes keys and never adds them.
    So wpStalenessOmitted and detailOmittedProvisional would raise ''violates contract'' at C4, and the fixture count of 47 is not producible as described. The plan''s wording ("registry strips before validation")
    describes a mechanism that does not exist for these cases.

    [merged PLAN-VERIFY-001] The plan defines the omitted-property fixtures (WP-22 and the FR-018 unit case) as kind host. checkFixtureDoc validates a host fixture strictly after stripHost, and stripHost
    never re-adds a member. A WorkPackage without staleness and a WorkPackageDetail without reviewCycles or workspace therefore fail the strict closed schema (required member missing). The fixtures are
    red on arrival, or the implementer weakens the check until it validates nothing. These are the only fixtures that prove omitted differs from null or empty (FR-018, Q9).'
  remediation: 'Declare the mechanism in contract-pin.md and in the IC-01 exit checks. For example, a registry field `omit: [''staleness'']` that makes C4 validate the document with the omitted members
    re-inserted as null (staleness) or [] and a minimal object (reviewCycles, workspace). Add a stripHost-style extension in validate.mjs, and a check.test.mjs case that the same document with the property
    truly missing still fails the strict schema (the reverted-must-fail proof). Alternatively list these two as not fixtures and build them in the stories by deleting the property from wpPopulated and detailPopulated
    (single source, no registry entry). The inventory then has 45 entries. State one of the two.

    [merged PLAN-VERIFY-001] FORK: (a) add named relaxations, for example provisional-omittable for WorkPackage and detail-omittable for WorkPackageDetail, whose patch removes only staleness, reviewCycles
    and workspace from required. Give each an allowedPath and the reverted-must-fail proof the relaxed kind already has (passes relaxed, fails strict, errors only at the allowed path). (b) Add a restoreHost
    step that re-inserts staleness null, reviewCycles [] and the workspace before strict validation, with a negative test that a fixture with any other defect still fails. Either way, contract-pin.md must
    name the mechanism and check.test.mjs and registry.test.mjs must cover it.'
  merged_from:
  - PLAN-VERIFY-001
  refuter_reason: stripHost in validate.mjs only deletes stale and actor, while schemas/WorkPackage.yaml requires staleness and WorkPackageDetail.yaml requires reviewCycles and workspace, so the host-kind
    fixtures wpStalenessOmitted (line 85) and detailOmittedProvisional (line 116) fail strict validation.
  fork: true
