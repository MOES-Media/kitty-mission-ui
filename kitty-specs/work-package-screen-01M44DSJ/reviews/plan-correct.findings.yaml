  - id: PLAN-CORRECT-014
    lens: Data model and event typing
    severity: 2
    title: "defaults.md and data-model.md disagree on names and leave two gaps (ResolvedFile vs RenderedFile, UNKNOWN_CHANGE_STATE vs UNKNOWN, unused ChangeStateView, unknown staleness status)"
    evidence:
      - artifact: "contracts/defaults.md § defaults/files.ts (UNKNOWN_CHANGE_STATE) and § logic additions (filesView(files: ResolvedFile[]), stalenessView); data-model.md § RenderedFile (\"the table's own UNKNOWN key\") and § Widened view types (ChangeStateView, not used in WorkPackageDetailView)"
    claim: >-
      The same function input is named ResolvedFile in one file and RenderedFile in the other,
      and the unknown-key constant has two names. ChangeStateView is defined but WorkPackageDetailView does not use it
      (ownedFiles is not widened). No relaxed fixture needs it, so it is dead.
      STALENESS_STATUS_ROLE has no stated result for a staleness status outside the three
      known values, although FR-023 requires a raw fallback.
    remediation: >-
      Pick one name for the filesView input and for the unknown-key constant. Delete
      ChangeStateView or add ownedFiles to WorkPackageDetailView. State that an unknown
      staleness status yields role 'none' and a raw word in the accessible description.
  - id: PLAN-CORRECT-015
    lens: Spec fidelity
    severity: 2
    title: E-17's file scope differs between research D-12 and gates.md
    evidence:
      - artifact: "research.md § D-12 (E-17 in history-parts.ts and facts-parts.ts only); contracts/gates.md § E-17 (history-parts.ts, facts-parts.ts and work-parts.ts); tracer-design-decisions.md G-10 (facts-parts.ts)"
    claim: >-
      The Workspace rows use the facts family and live in work-parts.ts (contracts/sk-work-package-screen.md
      Workspace region). Under D-12's scope that file would be refused class= by ESLint.
      The two documents give the operator different exceptions to approve at CP-1.
    remediation: >-
      Make research D-12 and tracer G-10 match gates.md (add work-parts.ts), or move the
      Workspace panel into facts-parts.ts and narrow gates.md. State the single scope in the
