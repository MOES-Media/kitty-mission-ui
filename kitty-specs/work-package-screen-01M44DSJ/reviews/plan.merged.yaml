- id: PLAN-VERIFY-006
  lens: Gates (C8 tests are function-level; the wrap-up path is the CLI)
  severity: 3
  title: --require-main and the verify-remote branch-pin behaviour have no CLI-level test, yet they are the only blocking wrap-up check
  evidence:
  - artifact: 'contracts/contract-pin.md, C8 tests and ''Other tooling changes''; plan.md PR shape (blocking steps contract:verify-remote and contract:check --require-main); research D-09 item 4 (recorded
      weakness: CI cannot see provenance)'
  - code: '<4>/scripts/contract/check.mjs: main() takes no arguments, and the exit code comes only from the driver'
  - code: '<4>/scripts/contract/check.test.mjs: calls check(root) in-process; no spawn or execFile anywhere in the file'
  - code: '<4>/scripts/contract/verify-remote.mjs: main() exits 0 or 1 on byte comparison only'
  claim: The planned C8 node tests call the function with an option. The flag is read from process.argv by the scripts, and pnpm passes the argument through. A parsing slip (flag ignored, wrong exit code)
    leaves every planned test green while contract:check --require-main exits 0 on a branch pin. The verify-remote rule 'prints not verifiable, exits 0, or non-zero with --require-main' has no test at all.
    The PR-readiness gate then succeeds while checking nothing.
  remediation: Add node:test cases that spawn node scripts/contract/check.mjs --require-main against a temp copy with a branch pin and assert a non-zero exit and the token 'pin provenance'. Spawn the same
    command on a main pin (positive control) and without the flag on a branch pin (exit 0). Factor verify-remote's provenance decision into a pure function and test both outcomes. Add the CLI spawn to the
    IC-01 exit checks.
- id: PLAN-VERIFY-007
  lens: Silent-success (provenance label is self-asserted)
  severity: 3
  title: 'provenance: main" is never verified to be on spec-kitty main; the re-pin proofs would pass for an unmerged commit'
  evidence:
  - artifact: contracts/contract-pin.md, steps 4 and 5 and C8; research.md D-09 item 4; plan.md PR shape
  - code: '<4>/scripts/contract/verify-remote.mjs: main() fetches pin.sha by sha and compares bytes and lane weights; it never checks the sha is reachable from upstream main'
  - code: '<4>/scripts/contract/update.mjs: fetchRef(sha) accepts any fetchable commit'
  claim: 'contract:update --sha <sha> writes provenance main for whatever it was given. verify-remote then re-fetches the same sha and the bytes match. C8 and --require-main only check the label. A commit
    that exists only on the #5625 branch or a PR ref would pass all three and be recorded as ''main''. This is the failure the provenance mechanism exists to prevent.'
  remediation: In update.mjs (writing main) and verify-remote.mjs (for a main pin), fetch upstream main and require the pin sha to be an ancestor (git merge-base --is-ancestor), failing closed otherwise.
    Cover it with a pure-function test, using a temp repo where the sha is on a side branch. Add it to the wrap-up proofs in plan.md.
- id: PLAN-VERIFY-008
  lens: Test strategy per requirement (fixture coherence, C5 scope)
  severity: 3
  title: Plan says WorkPackage has no derivable coherence rule, but the contract defines exact derived rules that hand-built overlays can violate unchecked
  evidence:
  - artifact: contracts/contract-pin.md, 'Other tooling changes' (C5 stays Mission-scoped; a subtaskProgress that disagrees with the list 'is allowed by the contract'; SYNTHETIC_ACTORS claim); research.md
      D-10
  - code: '<lane-1.1>/schemas/WorkPackage.yaml: readyToStart x-derived ''True when statusLane is planned and readiness.satisfied is true''; history x-derived ''sorted by at then eventId ascending'''
  - code: '<lane-1.1>/schemas/SubtaskProgress.yaml: done and total x-derived from the resolved subtask map'
  - code: '<4>/scripts/contract/check.mjs: coherenceFailures and actorProblems only handle MissionDetail, MissionOverviewPage and doc.workPackages'
  claim: The contract states readyToStart, subtaskProgress and history order as exact derivations. Many planned fixtures are hand-edited overlays (wpDone with a full bar, wpReady and wpBlocked, wpPopulated
    with part-done subtasks, wpHistoryRich, the bulk 60-entry history). Nothing recomputes them, so WP-07, WP-13, WP-14 and the history baselines can show an incoherent but visually plausible state and
    pass. A history that is not in time order also makes the 'array order, no sort' tests meaningless. The claim 'every actor value comes from SYNTHETIC_ACTORS' is not enforced either, because actorProblems
    never looks at a WorkPackage document.
  remediation: 'Add C5 rules for WorkPackage fixtures, recomputed independently of overlays.mjs as #4 does: readyToStart equals (lane planned and readiness.satisfied); subtaskProgress equals the counts
    of the subtasks map; history non-decreasing by at. Give each a negative node test. Extend actorProblems to the WorkPackage shapes (actor handles, history actor, cycle reviewer), or delete the SYNTHETIC_ACTORS
    sentence from contract-pin.md.'
