- id: PLAN-CORRECT-007
  lens: Contract fidelity
  severity: 3
  title: Fixture pairing and overlays leave wpId, statusLane and history inconsistent; the 'same wpId' node test cannot pass as specified
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 Fixture inventory (wpPopulated 'set to in_progress', wpReviewNone, wpApproved, wpChangesRequested, wpDone) and last paragraph (host compositions, node test\
      \ that both fixtures agree on wpId, none deliberate)"
  - code: 'lane examples: WorkPackage.populated wpId WP04, statusLane for_review, history last entry to for_review; WorkPackageDetail.populated WP04; null-workspace WP01; no-cycles WP02; planning-lane WP06;
      unknown-change-state WP05; unparseable-cycle WP03; WorkPackage.actor-handle WP02, actor-redacted WP03'
  claim: The detail examples carry fixed wpIds (WP01 to WP06) that differ from the WorkPackage overlay bases (WP04, WP07, WP08 and so on). Stories such as WP-29 (detailNoCycles WP02), WP-32/33 (WP01, WP06)
    and WP-35b (WP03) need a WorkPackage with the same wpId, and the inventory declares no wpId overlay, so the node test will fail or the pairs will be invented ad hoc. Separately, overlays that change
    statusLane (wpPopulated to in_progress, wpChangesRequested, wpApproved, wpReviewNone) do not say they rewrite history. The base history ends at for_review, so the story would show header "approved"
    or "in progress" while the newest history entry (the one marked "Current", Q12) says for_review. The contract has no WorkPackage coherence rule, so only the overlay text can prevent this.
  remediation: State in contract-pin.md (a) a pairing table per story, with the wpId overlay applied to the WorkPackage side (or the detail side) for every pair, and (b) for every overlay that changes statusLane,
    the history, subtaskProgress and subtasks entries it rewrites, so the last history entry's toStatusLane equals statusLane. Add the pairing table to the IC-09 node test's input.
- id: PLAN-CORRECT-008
  lens: Spec fidelity
  severity: 4
  title: 'FORK: the detail refusal code has no input path into the screen, so resolveRefusal and the two refusal fixtures have no consumer'
  evidence:
  - artifact: "data-model.md \xA7 View states (detailStatus error / not-found; \"the detail refusal itself arrives as detailStatus, not as data\") and \xA7 Vocabulary tables (refusals.ts keyed by the two\
      \ codes); contracts/defaults.md (resolveRefusal(code), DETAIL_REFUSAL_WORDS keyed not_found / source_unreadable); contracts/sk-work-package-screen.md \xA7 Story catalogue (WP-36a/b use `detailStatus`\
      \ values only); contracts/contract-pin.md (detailRefusalNotFound, detailRefusalUnreadable named for WP-36a/b)"
  - artifact: spec.md Q9 (refusal code passed through, worded only through defaults/), Q7, FR-024
  - code: 'lane schemas/WorkPackageDetailRefusalCode.yaml: values not_found, source_unreadable (snake_case); the screen''s DetailStatus value is ''not-found'' (hyphen)'
  - artifact: "data-model.md \xA7 View states (the detail refusal itself arrives as detailStatus, not as data; DetailStatus has not-found and error, unknown collapses to error); contracts/sk-work-package-screen.md\
      \ Properties (no refusal property; detail is WorkPackageDetailView or null); defaults.md resolveRefusal(code) and DETAIL_REFUSAL_WORDS keyed by code; contract-pin.md fixtures detailRefusalNotFound\
      \ and detailRefusalUnreadable (WP-36a, WP-36b); spec.md Q7, Q9, FR-023, NFR-011 (refusal in words, code passed through)"
  claim: 'The element has no property carrying the refusal code, only detailStatus. resolveRefusal takes a code string, but nothing supplies one. The code to detailStatus mapping (''not-found'' to not_found,
    ''error'' to source_unreadable) is described in prose and is lossy: an ''error'' caused by a transport failure would be worded "A source of the Work Package detail could not be read", a contract claim
    the host did not make. The two valid refusal fixtures are listed for WP-36a/b but the stories use detailStatus only, so those fixtures (and Q9''s "pass through") are never exercised.

    [merged PLAN-VISUAL-008] Q7 and Q9 require the notice to name the refusal code in words with a raw fallback for an unknown code, and WP-36 covers both codes. The surface (frozen by IC-03b) has no property
    for the code: detailStatus carries only not-found or error, an unknown value collapses to error, and error is also the generic fault. The screen would have to map a status value to a code (a literal)
    or show one generic sentence, and the raw-fallback and unknown-code paths (FR-023) cannot be exercised. The two valid refusal fixtures are listed for WP-36a/36b but nothing consumes them.'
  remediation: 'FORK, orchestrator to rule. (a) Add an optional property detailRefusalCode (attribute-less, string | null, additive before the IC-03b freeze): when set it is looked up in DETAIL_REFUSAL_WORDS
    with raw fallback; detailStatus error / not-found without a code uses a generic regional wording; WP-36a/b take the code from the two fixtures. (b) Keep detailStatus only, key DETAIL_REFUSAL_WORDS by
    the two detailStatus values, drop resolveRefusal''s code argument and the two refusal fixtures (45 new exports) and amend Q9 wording through a P-5, accepting that the contract code is never shown. State
    which remedy in plan.md and update data-model.md and defaults.md.

    [merged PLAN-VISUAL-008] FORK: (a) add an optional property (for example detailRefusalCode, string or null) to the frozen surface so the notice reads lookup(DETAIL_REFUSAL_WORDS, code) with a raw fallback
    (amend FR-001 as P-2/P-3 do); (b) let detail carry the WorkPackageDetailRefusal object when detailStatus is not ready, with the same lookup; (c) drop code-level wording and amend Q7/Q9 and WP-36 to
    two fixed sentences keyed by detailStatus. Either way make WP-36a/36b use the refusal fixtures and add an unknown-code story or test.'
  merged_from:
  - PLAN-VISUAL-008
