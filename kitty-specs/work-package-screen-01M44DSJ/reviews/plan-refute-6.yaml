    reason: 'research D-04 EV-2 dispatches on the host and asserts the screen emits nothing, which is vacuous because that event never enters the shadow tree; plan.md line 147 gives IC-07 the event methods while the traceability rows land EV-1 at IC-06, EV-5 at IC-06 and EV-6 at IC-05, which are IC-06 and IC-05 WPs barred from editing that file.'
  - id: PLAN-VERIFY-014
