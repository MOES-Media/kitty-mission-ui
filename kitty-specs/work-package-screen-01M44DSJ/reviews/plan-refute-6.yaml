    reason: 'SC-004 and the data-model detailStatus table list subtasks, dependencies and owned files as detail regions, yet resolveLists degrades them to bare 1.0 forms when detail is null, and the error and loading behaviour for those three lists is never stated; no region-identifier enumeration exists for a set-equality test.'
  - id: PLAN-VERIFY-012
