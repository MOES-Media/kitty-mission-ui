    reason: 'research D-17 and spec NFR-006 require node identity plus a 200 ms bound on re-render but never name the property change; the #4 model test works because a real filter press hides rows, and a no-op re-render would pass the wall-clock bound alone (severity 2 to 3).'
  - id: PLAN-VERIFY-015
