    reason: 'verify-remote.mjs main() only fetches pin.sha by sha and compares bytes and lane weights, and a grep of scripts/contract and the mission docs finds no merge-base or ancestor check for the pin sha, so an unmerged sha labelled provenance main passes every proof (severity 3 is fair).'
  - id: PLAN-VERIFY-008
    verdict: confirmed
