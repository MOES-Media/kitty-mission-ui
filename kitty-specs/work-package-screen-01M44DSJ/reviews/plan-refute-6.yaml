  - id: PLAN-VERIFY-009
    verdict: confirmed
    reason: 'FR-023 demands raw fallback for verdict, change state and refusal words, but D-17 specifies a foreign-value test for lanes only, and stalenessView reads STALENESS_STATUS_ROLE with no stated outcome for a status that is not a key (defaults.md).'
  - id: PLAN-VERIFY-010
    verdict: confirmed
    reason: 'Not-drawn rows (WP-22, WP-33b, WP-35 and others) are covered only by baselines plus one named detailOmittedProvisional unit test (plan FR-018 row); no per-region DOM-absence assertion, positive-control sibling or omitted-vs-empty paired test is specified, and no row covers detail null with detailStatus ready (severity may be 2).'
  - id: PLAN-VERIFY-011
