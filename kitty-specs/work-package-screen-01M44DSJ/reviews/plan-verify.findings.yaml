      - code: "<4>/packages/mission-ui/test/surface-freeze.test.ts: NEW_TAGS and SURFACE list tag, property, attribute and default for the five #4 elements, so 'a later work package that changes the surface fails here'"
    claim: >-
      The manifest gate regenerates and compares, so a later WP that adds a property and runs pnpm manifest:generate stays
