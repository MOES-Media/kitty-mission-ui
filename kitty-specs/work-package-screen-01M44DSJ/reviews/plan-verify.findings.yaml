    remediation: >-
      IC-03b adds sk-work-package-screen to surface-freeze.test.ts: the nine properties with attributes and run-time
      defaults (status loading, detailStatus ready, workPackage null, detail null, mission null, wpId '', now null, labels
      null, errorMessage ''), and the four event names. Add the file to the IC-03b scope.
  - id: PLAN-VERIFY-018
    lens: Gates (new tooling without tests)
    severity: 3
    title: contract:update --from-repo, the mechanism behind the 'dirty lane cannot leak' and 'path never recorded' claims, has no planned tests
    evidence:
