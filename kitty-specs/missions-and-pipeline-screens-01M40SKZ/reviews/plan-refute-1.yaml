    reason: "contract-pin.md line 44 defines test:contract as `node --test scripts/contract/` with no index.js planned, and on Node v22.22.2 in a scratch dir that command reported 1 fail, 0 pass while the repo's hygiene and gate-proof dirs need an index.js for the same reason."
  - id: PLAN-FIT-002
    verdict: confirmed
    reason: "contract-pin.md line 77 sets review pending next to for_review/approved/done WPs, while MissionDetail.yaml says review is pending only when no WP is for_review, in_review, approved or done, and C4/C5 as specified check neither."
