    reason: "stylelint.config.mjs LAYOUT_PROPERTIES allows position, overflow, margin, inline-size and block-size and TOKEN_ONLY allows the value 0, so a zero-size absolutely positioned overflow-hidden box passes the gate (as the finding's own remediation shows) and plan G-07 plus spike S3 already cover verifying this, so the claim that no technique passes is false."
