schema: review-findings/v1
complete: true
phase: plan
findings:
- id: PLAN-FIT-001
  lens: Contract consumption integrity
  severity: 4
  title: test:contract as written (`node --test scripts/contract/`) fails on the pinned Node 22.22.2, so gate `contract` cannot go green
  evidence:
  - artifact: "contracts/gates.md \xA7 Gate table and \xA7 Gate `contract` Command: `pnpm contract:check && pnpm test:contract`; contracts/contract-pin.md \xA7 Commands: `test:contract` = `node --test scripts/contract/`"
  - code: 'package.json:23 (`test:preflight` = `node --test scripts/preflight.test.mjs`, explicit file); verified in scratch dir with node v22.22.2: `node --test scripts/contract/` exits 1 (ERR_TEST_FAILURE,
      1 fail, 0 pass) while `node --test scripts/contract/*.test.mjs` passes'
  - artifact: "contracts/contract-pin.md \xA7 Commands: test:contract is 'node --test scripts/contract/'; contracts/gates.md gate table and Command"
  - code: 'scripts/hygiene/index.js and scripts/gate-proof/index.js: comment ''Node 22 treats a directory argument to node --test as a module to load; this entry point makes node --test scripts/<dir>/ run
      the suite'' (the repo already hit this)'
  claim: 'From Node 21 a directory argument is no longer searched recursively, it is run as a file. The plan''s only definition of the test command therefore fails on the repo''s pinned Node, in CI and
    in the proof leg. Every existing node:test script in the repo lists explicit files.

    [Merged duplicate PLAN-VERIFY-002]: Reproduced on the pinned Node v22.22.2 in a scratch dir with scripts/contract/a.test.mjs and no index.js: ''node --test scripts/contract/'' prints ''Cannot find module
    .../scripts/contract'' and reports 1 failed test. The plan lists scripts/contract/*.test.mjs but no index.js. The clean run of the gate (and therefore the proof leg''s clean run, which must exit 0)
    fails; ''node --test scripts/contract/*.test.mjs'' passes.'
  remediation: 'Define `test:contract` as `node --test scripts/contract/*.test.mjs` (or an explicit file list), in contract-pin.md, gates.md and the plan''s gate table. IC-01 acceptance: run it in the clean
    worktree and require at least one test executed (pass count above 0).

    [From PLAN-VERIFY-002]: Change test:contract to ''node --test scripts/contract/*.test.mjs'' (shell glob, as pnpm runs sh) or add scripts/contract/index.js that dynamically imports the test files, as
    the two existing directories do. The gate''s ciCommand, the CI step and the plants must carry the identical string. Make IC-01''s exit check ''pnpm test:contract'' print a passing test count above zero.'
  merged_from:
  - PLAN-VERIFY-002
  refuter_reason: contract-pin.md line 44 defines test:contract as `node --test scripts/contract/` with no index.js planned, and on Node v22.22.2 in a scratch dir that command reported 1 fail, 0 pass while
    the repo's hygiene and gate-proof dirs need an index.js for the same reason.
- id: PLAN-FIT-002
  lens: Contract consumption integrity
  severity: 4
  title: Fixture `detailImplement` (PL-01) is a state the pinned contract cannot produce, and neither C4 nor C5 would notice
  evidence:
  - artifact: "contracts/contract-pin.md \xA7 Fixture inventory, row `detailImplement`: 'phases overlaid so implement is in_progress and review pending; WPs spread over planned, claimed, in_progress, for_review,\
      \ approved, done'"
  - artifact: data-model.md I-09 and research.md D-11 ('so no fixture contradicts the contract it claims to follow'); spec.md PL-01 (implement in progress, review pending, cards in all five columns)
  - code: 'contracts/mission-status/schemas/MissionDetail.yaml, field phases (rule: review is pending ONLY when no work package is for_review, in_review, approved or done; otherwise in_progress). The contract''s
      own populated example shows exactly that: implement and review both in_progress.'
  claim: Work packages in for_review, approved or done force review to in_progress under the contract's derivation. The planned fixture sets review to pending next to such work packages, so PL-01 (and its
    baseline, the screen's flagship story) shows contract-incoherent data. C4 only checks the JSON schema (the rule is prose and x-derived, not schema), and C5 only checks lane counts, so the gate passes
    it. The gate cannot back the claim that fixtures follow the contract.
  remediation: 'Extend C5 to verify the phases implement and review of every MissionDetail fixture against the rule quoted in MissionDetail.yaml (a ten-line pure function of statusLaneCounts and wpTotal).
    Then resolve PL-01 explicitly, as an orchestrator/operator decision recorded in the plan: either (a) amend PL-01 to the contract-true bar (done, done, done, current, current), which is drift from the
    prototype to register as a DR, or (b) keep review pending and restrict the work packages to planned, claimed and in_progress (Review, Approved and Done columns then show count 0, which weakens the screenshot),
    or (c) register a named relaxation `phase-status-open` with the same reverted-must-fail proof. Do not ship a silent exception.'
  refuter_reason: contract-pin.md line 77 sets review pending next to for_review/approved/done WPs, while MissionDetail.yaml says review is pending only when no WP is for_review, in_review, approved or
    done, and C4/C5 as specified check neither.
- id: PLAN-FIT-003
  lens: Contract consumption integrity
  severity: 3
  title: Overlays claim to recompute derived fields, but `progress` cannot be recomputed from the contract and is not checked
  evidence:
  - artifact: research.md D-11 (overlays recompute statusLaneCounts, wpTotal, blockedCount, lifecycleStatus, phase statuses); contracts/contract-pin.md (derived fields recomputed from the work packages
      the overlay sets); contracts/gates.md C5 (counts, wpTotal, blockedCount only)
  - code: contracts/mission-status/schemas/MissionProgress.yaml (weightedPercentage cites only `compute_weighted_progress`, no weights are in the contract; doneCount, donePercentage derivable) and MissionHead.yaml
      lifecycleStatus (deterministic rule from counts, discardedAt, acceptedAt)
  claim: An overlay cannot compute weightedPercentage because the lane weights are not part of the vendored contract. As written the all-complete, all-pending, blockers and subtask fixtures inherit the
    base example's progress (65 weighted, 50 done, doneCount 3), so PL-03 would show 65% next to every phase complete and every card done, and PL-02 a non-zero figure with no work packages. C5 also leaves
    doneCount, donePercentage and lifecycleStatus unchecked although the contract defines them.
  remediation: 'State in contract-pin.md that overlays SET progress explicitly per fixture (an overlay parameter, 0 for no work packages, 100 when all done) and that weightedPercentage is only range-checked
    (0..100, 0 when wpTotal is 0). Add to C5: doneCount equals statusLaneCounts.done, donePercentage equals round-to-4-decimals of done over wpTotal (0 when wpTotal is 0), lifecycleStatus equals the rule
    order in MissionHead.yaml, semantics constant. Fix the D-11 sentence so it does not promise recomputation of progress.'
  refuter_reason: D-11 does not actually list progress among recomputed fields (the claim's wording is slightly off), but nothing in the plan sets progress, doneCount, donePercentage or lifecycleStatus
    per overlay or checks them in C5, so all-complete and all-pending fixtures inherit the base example's 65 percent, which contradicts the plan's "no fixture contradicts the contract".
- id: PLAN-FIT-004
  lens: Architecture and charter (gate design)
  severity: 4
  title: The planned `RowView.blocked` key trips gate `data-driven` selector S5 in `src/logic/row.ts`
  evidence:
  - artifact: "data-model.md \xA7 Screen and element types: `RowView = { ...; blocked: StateBadge | null; stale ...}` produced by `buildRowView` in `src/logic/row.ts`"
  - artifact: contracts/gates.md S5 `Property[computed=false] > Identifier.key[name=/^(LANE_ONLY|specify|implement|tasks)$/]`; scope scans `src/logic/**` (not allow-listed)
  - code: 'verified by running the S5 selector with esquery 1.7.0 (node_modules/.pnpm/esquery@1.7.0) over a typescript-eslint AST: `{ blocked: badge }` and the shorthand `{ blocked }` both match (1 hit
      each); `{ done: 1, total: 2 }` does not'
  - artifact: 'data-model.md RowView ({ ...; blocked: StateBadge | null; ... }) and PhaseState (''done'' | ''current'' | ''pending''); defaults.md buildRowView lives in src/logic/ (scanned); gates.md Scope'
  - code: 'scratch run: ''{ blocked: badge, stale: false }'' reports S5; ''type PhaseState = "done" | "current" | "pending"'' reports S1'
  claim: '`blocked` is one of the lane words in LANE_ONLY. The object literal that builds a RowView in the scanned logic module is flagged, so the mission''s own code fails its own new gate (or an implementer
    silences it with a disable comment, defeating the gate). Reading `row.blocked` in the element is fine; the construction is not.

    [Merged duplicate PLAN-VERIFY-008]: buildRowView returns an object literal with an identifier key ''blocked'' (a lane name in LANE_ONLY) from src/logic/, which the gate scans, so IC-02 or IC-07 would
    fail the gate on the plan''s own data shape. The type PhaseState holds the literal ''done''; the plan does not say which module declares it, and every module except defaults/ and contract/ is scanned.
    Rework inside a WP, not a design error, but two WPs (IC-02 logic, IC-05 phase bar) would each rediscover it.'
  remediation: 'Rename the field (`blockedBadge`) in data-model.md, contracts/defaults.md and the missions-screen contract. Add a rule to gates.md: no plan type may use a key from WORDS as an object-literal
    key outside `defaults/` and `contract/`, and add a selftest fixture for the shorthand form `{ blocked }`. Scan the other planned object shapes (PlacedCard, PlacedColumn, LaneGroup, StateBadge, FilterDefinition)
    for the same collision.

    [From PLAN-VERIFY-008]: Rename RowView.blocked to blockedBadge and state in data-model.md that PhaseState is declared in src/defaults/phases.ts (or contract/types.ts) and only imported elsewhere. Add
    a gates.md sentence listing ''field names equal to a lane value are forbidden in view types''.'
  merged_from:
  - PLAN-VERIFY-008
  refuter_reason: 'data-model.md line 43 declares RowView with key `blocked` built by buildRowView, and running the S5 selector with esquery 1.7.0 over a typescript-estree AST matched both `{ blocked: badge
    }` and `{ blocked }` (1 hit each), while src/logic is scanned.'
- id: PLAN-FIT-005
  lens: Architecture and charter (gate design)
  severity: 3
  title: Phase bar needs a glyph per phase state, but no glyph table exists in `defaults/` and any comparison with 'done' trips S1
  evidence:
  - artifact: "contracts/sk-phase-bar.md \xA7 Semantics ('check mark for done, a dot for current, empty for pending'); contracts/defaults.md \xA7 defaults/phases.ts (exports DEFAULT_PHASE_LABELS, PHASE_STATE,\
      \ PHASE_STATUS_TEXT, PHASE_TONE, NO_STEP_TEXT, CURRENT_STEP_PREFIX; no glyph table); data-model.md (`PhaseState = 'done' | 'current' | 'pending'`, file not stated)"
  - artifact: contracts/gates.md S1 `Literal[value=/^(WORDS)$/i]` with `done` in WORDS
  - code: 'verified with esquery 1.7.0 over a typescript-eslint AST: `type PhaseState = ''done'' | ''current'' | ''pending''` and `state === ''done'' ? x : y` each produce 1 S1 hit'
  claim: An implementer choosing the glyph by comparing the state to 'done' gets a data-driven failure; the PhaseState type itself contains the literal 'done' and is only legal in `defaults/` or `contract/`,
    which the plan never says. The surface is under-specified in exactly the file the gate protects.
  remediation: 'Add `PHASE_GLYPH: Readonly<Record<PhaseState, string>>` (and any marker text) to `defaults/phases.ts`, read through `lookup`, and state that `PhaseState` is declared in `defaults/phases.ts`.
    The element must contain no comparison against a PhaseState value. Add a negative selftest for the glyph lookup.'
  refuter_reason: 'sk-phase-bar.md requires a check/dot/empty glyph per state but defaults.md lists no glyph table and data-model.md does not say which file declares PhaseState, and the S1 selector flags
    the literal ''done'' in a type or comparison outside defaults/contract (esquery check: 1 hit).'
- id: PLAN-FIT-008
  lens: Spec fidelity
  severity: 3
  title: Plan-introduced drift DR-1..DR-11 is left for the operator at PR time, while C-006/NFR-008 make unapproved drift a REJECT for every WP reviewer
  evidence:
  - artifact: "plan.md \xA7 Charter Check ('visual regression ... pass with approved drift AD-1 to AD-3 and DR-1 to DR-11, each to be confirmed by the operator') and \xA7 Deviations (P-6 confirm at PR)"
  - artifact: spec.md C-006 ('Any other drift is a defect and a visual review REJECT'), NFR-008, FR-032
  claim: The per-WP reviewer agent must REJECT each baseline that shows an unapproved difference (card state words, progress bar on every card, full-precision percentage, phase connector). With the approvals
    deferred to PR review the WPs either all bounce or the reviewers silently waive the rule, which the charter forbids.
  remediation: 'Make P-6 a pre-tasks decision: the orchestrator asks the operator to confirm or amend DR-1..DR-11 (and the copy defaults) now and records the outcome in spec.md Clarifications; WP briefs
    then cite the approved list as the only allowed drift. Anything not confirmed is removed from the plan before tasks.'
  refuter_reason: plan.md lines 34, 54, 323 and 333 leave DR-1 to DR-11 awaiting operator confirmation at PR time while spec C-006 says any drift beyond AD-1 to AD-3 is a visual review REJECT, so WP reviewers
    have no approved list to review baselines against.
- id: PLAN-FIT-009
  lens: Architecture and charter (sequencing)
  severity: 3
  title: IC-09 depends on two lanes, but the plan states that a lane cannot have two parents and gives no procedure
  evidence:
  - artifact: "plan.md \xA7 Implementation Concern Map (lanes A and B; 'spec-kitty cannot parent a lane on two lanes'; IC-09 depends on IC-07 and IC-08) and IC-09 Purpose 'merge both lanes'"
  - code: the orchestrator's tooling ledger, a spec-kitty tooling issue (dependent lane allocated from a stale commit; workaround is a manual `git merge --no-ff` of the approved parent into the lane worktree) and a spec-kitty tooling issue (lanes
      parent off a stale mission branch)
  - artifact: plan.md Implementation Concern Map intro and IC-09 Sequencing (IC-07 and IC-08, one in lane B, one in lane A); IC-04 and IC-05 both depend on IC-03
  - artifact: 'the orchestrator's tooling ledger, a spec-kitty tooling issue (dependent lane allocated from a stale coordination commit; workaround: git merge --no-ff the approved parent lane, or pre-create lane branches from the approved
      parent lane) and a spec-kitty tooling issue (fresh dependent-lane allocation refuses a derived status.json conflict; operator workaround merge -X ours and verify the snapshot against the log)'
  - artifact: 'the orchestrator's tooling ledger: claim failing with ''ancestry could not be established'' for a WP depending on two approved lanes'
  claim: 'IC-09 needs both lanes'' code to run the five clean visual runs, host-composition test and gate-proof, yet the tool can attach it to one parent only. Without a stated procedure the IC-09 agent
    will improvise merges (the failure mode already recorded twice in the ledger) inside a work package that owns shared files.

    [Merged duplicate PLAN-SEQ-003]: The plan states that a lane that depends on another is created from its parent''s branch and that spec-kitty cannot parent a lane on two lanes, then makes IC-09 depend
    on IC-07 (lane B) and IC-08 (lane A) without saying where IC-09 runs or how it obtains both lanes'' code. IC-09 needs both (118 stories, host-composition test, five clean visual runs). The ledger records
    that allocating a dependent lane from an approved parent already fails without orchestrator intervention, and IC-04 and IC-05 are two such allocations off IC-03. The plan has no note
    of any of this, so the orchestrator would rediscover it mid-mission.'
  remediation: 'State in the plan: IC-09 is parented on IC-08; the orchestrator (not the WP agent) merges the approved IC-07 lane into the IC-09 lane worktree before dispatch, resolving `custom-elements.json`
    by regeneration, and verifies both lanes'' stories are present. Alternatively serialise IC-07 after IC-08 and drop lane B parallelism. Add the check to the IC-09 brief.

    [From PLAN-SEQ-003]: Add a "Lane mechanics" paragraph to the Concern Map: (1) before dispatching IC-04 and IC-05 the orchestrator pre-creates both lane branches from the approved IC-03 lane tip (dependent-lane allocation
    workaround); (2) before claiming IC-09 the orchestrator merges the approved lane-B tip into the lane-A workspace (or the reverse) with `git merge --no-ff`, resolves custom-elements.json by `pnpm manifest:generate`
    only, and verifies status.json against the event log; (3) IC-09''s first step is a green full gate run on that merged tree. Alternatively serialise IC-07 after IC-08 and drop the "two lanes"
    claim; record the trade-off (lane B is 2 WPs, 28 stories).'
  merged_from:
  - PLAN-SEQ-003
  refuter_reason: plan.md line 131 states a lane cannot have two parents and IC-09 depends on IC-07 and IC-08, yet no section gives a merge procedure, while recorded spec-kitty tooling issues describe dependent-lane
    allocation failing.
- id: PLAN-FIT-010
  lens: Shell interaction scope
  severity: 2
  title: Additive shell change is minimal and keeps baselines and manifest untouched, but the footer/inspector agreement claim has gaps
  evidence:
  - artifact: research.md D-28 ('early return for total <= 0 stays'; 'IC-08 gate'; 'typeof progress.percentage === number'); plan.md IC-03 (shell change is in IC-03) and contracts/sk-pipeline-screen.md
      (every Pipeline story shows footer and inspector agreeing; composition test asserts equal texts)
  - code: 'packages/mission-ui/src/elements/sk-mission-shell/shell-parts.ts:157-167 renderFooter (`if (!progress || progress.total <= 0) return nothing;` then rounded done/total, `value=${progress.done}
      max=${progress.total}`); src/shell-types.ts:55 `progress?: { done: number; total: number }`; test/sk-mission-shell.test.ts:559-565 asserts value=done, max=total'
  - code: packages/mission-ui/custom-elements.json contains no `progress`/ShellMission type text for the footer (verified by grep), so the manifest is unaffected; apps/storybook/tests/visual/__snapshots__
      holds exactly 58 PNGs and no shell fixture sets `percentage`
  claim: 'I verified the core claim: one optional field and one branch in renderFooter leave the existing 58 baselines, the existing footer tests and the manifest unchanged. Remaining gaps: (1) AllPending
    and any wpTotal 0 story has no footer (total <= 0 returns early) while the inspector shows a figure, so the composition test ''footer text equals inspector text'' cannot hold for those stories; (2)
    `typeof percentage === ''number''` accepts NaN and Infinity, producing an invalid `<progress value>`; (3) D-28 cites an ''IC-08 gate'' for the proof, but the plan places the change and its proof in
    IC-03.'
  remediation: Scope the agreement test to wpTotal above 0 and say so in the contract; use `Number.isFinite(progress.percentage)` in the branch and add a test for NaN falling back to the existing path;
    correct the D-28 reference to IC-03.
  refuter_reason: contract-pin.md defines detailAllPending with wpTotal 0 (PL-02) and renderFooter returns nothing for total <= 0, so the claim that every Pipeline story shows agreeing footer and inspector
    fails; D-28 also says "IC-08 gate" while plan IC-03 owns the proof, and typeof number admits NaN.
- id: PLAN-FIT-011
  lens: Spec fidelity
  severity: 2
  title: Public surface beyond the spec is not in the flagged amendment list (missions-href, error-message, label)
  evidence:
  - artifact: "contracts/sk-pipeline-screen.md properties `missionsHref`, `errorMessage`; contracts/sk-missions-screen.md `errorMessage`; contracts/sk-phase-bar.md and sk-work-package-board.md `label`;\
      \ plan.md \xA7 Spec amendment proposals P-1..P-6 (none covers them)"
  - artifact: spec.md FR-026 (every public property declared) and C-012 (no intent beyond the issue)
  claim: Each is a reasonable host-facing property, but they are neither in the spec nor in P-1..P-6, so the 'nothing invented beyond the spec unless flagged' rule is not met and the frozen manifest surface
    (IC-03) will carry unreviewed API.
  remediation: Add P-7 listing these properties and their defaults for operator confirmation, or drop `errorMessage` and `missionsHref` and use defaults only. Also state that `story-support/` is not importable
    from elements and name the mechanism that enforces it (an ESLint `no-restricted-imports` override), otherwise it is a rule with no gate.
  refuter_reason: missionsHref and errorMessage appear in research.md and contracts but not in spec.md and not in P-1..P-6, and the "elements may not import story-support" rule has no stated enforcing mechanism
    in plan, research or gates.md.
- id: PLAN-FIT-012
  lens: Spec fidelity
  severity: 1
  title: Small inconsistencies between plan files
  evidence:
  - artifact: plan.md Technical Context 'about 170 tests' vs contracts/gates.md unit-tests row 'about 130 browser-mode tests'; contracts/gates.md first paragraph says gate-proof coverage and checkWorkflow
      fail when 'a row in the README gates table and a changelog line' are missing
  - code: 'scripts/hygiene/rules.mjs:323-396 checkWorkflow and scripts/gate-proof/lib.mjs enforce job, matrix, plant-directory and `all` wiring only; no README or CHANGELOG check exists (grep README|CHANGELOG
      in scripts/: no hit)'
  claim: The test counts differ between files (130 vs 170; fine if 40 are node:test, but unstated), and the README row and CHANGELOG line are review items, not mechanically enforced as the sentence implies.
  remediation: Reconcile the counts (split browser-mode and node:test) and reword the gates.md sentence so only the job, matrix, plant and `all` wiring are described as enforced.
  refuter_reason: plan.md says about 170 tests while gates.md says about 130 browser-mode tests, and gates.md line 3 claims coverage and checkWorkflow enforce a README row and changelog line although grep
    of scripts/ finds no README or CHANGELOG check.
- id: PLAN-SEQ-001
  lens: Visual baseline and CI economics
  severity: 3
  title: CI timeout estimates rest on "no measurement exists", but real run timings exist and show the proposed timeouts are 2-4x too loose
  evidence:
  - artifact: research.md D-31 ("1.5 to 2 seconds per screenshot (inference, no measurement exists) ... 15 to 20 minutes"); research.md 'Not verified' ("The CI time of 590 screenshots (estimate)"); contracts/gates.md
      gate table (visual job 30 / proof 60; unit-tests job 10 / proof 12)
  - code: .github/workflows/ci.yml:396 (visual job timeout-minutes 10), :482 (proof-leg visual matrix timeout 15), :355 (unit-tests 6)
  - code: 'gh run view 36880654992 (CI on feat/app-shell, 290 executions): ''visual'' step 15:01:32-15:04:29 = 177 s, job 247 s; ''Gate: proof (visual)'' job 677 s; ''Gate: unit-tests'' 95 s (test step
      15 s). Run 36882394060 on main: proof (visual) 677 s, visual 247 s, unit-tests 95 s.'
  claim: 'The existing visual step costs 177 s for 290 test executions, about 0.61 s each, not 1.5-2 s. Scaling linearly by 590/290 gives about 6 min for the visual step (about 7.5 min job) and about 23
    min for the proof leg (677 s x 2.03, because the leg runs the command clean and planted, each with its own storybook build). The plan proposes visual job 30 and proof 60: 4x and 2.6x the scaled figures,
    which weakens the hang guard and burns runner minutes on a stuck job. The unit-tests job (95 s today, 15 s of it the test step) does not need 10 either. Also "590 screenshots" is really 590 test executions,
    each taking two captures (root.screenshot for the colour check plus toHaveScreenshot) and a fresh page.goto, so the per-screenshot framing is wrong. The only number that must rise is the proof-leg visual
    matrix timeout (15 min now, about 23 min expected).'
  remediation: 'Replace the D-31 inference with the recorded run data (cite run ids or the figures above) and set: visual job 10 -> 15, proof-leg visual matrix 15 -> 35, unit-tests job 6 -> 8 and matrix
    8 -> 10 (new tests are browser-mode, 130 on top of a 15 s step), unless the IC-01 baseline timing (see PLAN-SEQ-002) says otherwise. Drop "no measurement exists" from D-31 and the Not-verified list,
    and say "executions" not "screenshots" for the 590 figure.'
  refuter_reason: gh run 36880654992 shows Gate visual 15:00:21-15:04:34 (about 253 s job) and proof (visual) about 658 s for 290 executions, contradicting D-31's "no measurement exists" and 1.5-2 s per
    screenshot, so the proposed 30 and 60 minute timeouts are far looser than scaled data implies.
- id: PLAN-SEQ-002
  lens: Phasing
  severity: 3
  title: IC-09 sets CI timeouts "from measured values" of the first PR run, but the PR is opened only after IC-09 and the wrap-up, so the sequence is circular
  evidence:
  - artifact: plan.md IC-09 Purpose ("CI timeouts from measured values") and PR shape section (PR opened only after accept, test cleanup, squad, compaction, rebase)
  - artifact: contracts/gates.md line 23 and quickstart.md 'Timing record (IC-09)' ("measured wall-clock durations of the first pull-request run")
  - artifact: research.md D-31 ("IC-09 replaces the estimates with the first PR run's measured durations in the PR description"), R-06
  claim: No pull-request run can exist while IC-09 executes, so IC-09 cannot take measured PR-run values. The PR description is also written at PR-open time, before any run. If timeouts are corrected after
    the first run, that is a commit after the history was compacted and the PR opened, which the wrap-up sequence does not allow for. As written, IC-09 either ships the estimates (and the "measured" claim
    is false) or invents numbers.
  remediation: Make IC-01 record the baseline wall-clock of `pnpm visual` (it already runs it; 58 PNGs x5 not needed, one run is enough) and of `pnpm test`, and derive the new timeouts at IC-09 from those
    local figures plus the run history in PLAN-SEQ-001 with a stated margin. State the PR description reports "timeouts derived from run <ids> and local measurement; actual first-run durations will be added
    as a PR comment". If a post-PR timeout fixup is accepted, say so explicitly as the one allowed commit after the draft PR opens.
  refuter_reason: gates.md line 23, quickstart.md lines 69-71 and D-31 require IC-09 to record the first pull-request run durations, but plan.md opens the PR only after IC-09 and the wrap-up sequence, so
    no such run exists at that point.
- id: PLAN-SEQ-004
  lens: Write scopes and shared files
  severity: 3
  title: The shared-files table omits files both lanes are likely to touch (defaults, logic, fixture overlays and registry, tracer files, manifest), so the "lanes disjoint" claim is not complete
  evidence:
  - artifact: 'plan.md ''Shared files: who may write them'' table (rows: index.ts and manifest, eslint, stylelint, ci/package/README, visual spec, shell, CHANGELOG/README prose, baselines)'
  - artifact: 'plan.md Project Structure: src/defaults/{lanes,phases,lifecycle,pipeline-copy,index}.ts and src/logic/* (IC-02), src/contract/fixtures.generated.ts and scripts/contract/overlays.mjs + registry.mjs
      (IC-01), tracer-*.md'
  - artifact: contracts/gates.md gate `contract` C3 (fixtures.generated.ts must equal a fresh generation) and tracer-design-decisions.md ('Spike outcomes are appended by the work packages')
  - code: 'packages/mission-ui/custom-elements-manifest.config.mjs globs src/elements/**/*.ts: any JSDoc or public-member change in a lane diffs custom-elements.json (scripts/check-manifest.mjs compares
      bytes)'
  claim: Lane A (IC-05, 06, 08) and lane B (IC-04, 07) both read src/defaults, src/logic and the generated fixtures, and will find gaps (a missing label, a missing fixture for a story, a changed card word
    after spike S3). Editing them from two lanes produces conflicts in defaults/index.ts, fixtures.generated.ts (a generated file whose freshness is a gate) and custom-elements.json, none of which the table
