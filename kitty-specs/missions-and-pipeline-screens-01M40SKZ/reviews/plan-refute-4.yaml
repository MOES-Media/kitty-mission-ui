verdicts:
  - id: PLAN-VERIFY-005
    verdict: confirmed
    reason: S3 regexes need '>' before and '<' after the word inside one TemplateElement, and quasis split at every ${}, so '${n} blocked</p>' and 'Review${x}' slip through as gates.md S3 is written.
  - id: PLAN-VERIFY-006
    verdict: confirmed
    reason: C-007 forbids a hard-coded phase count but S8 and S9 only match literal index access and .length comparisons, so repeat(5,1fr), nth-child(5) and slice(0,5) match no selector.
  - id: PLAN-VERIFY-007
    verdict: confirmed
    reason: I-02, D-08 and defaults.md claim lifecycle and phase-status literals are enforced but WORDS holds only phases and lanes, and S5 uses LANE_ONLY (no done) so the gates.md sentence that { done, total } is flagged by S5 is false.
  - id: PLAN-VERIFY-009
    verdict: confirmed
    reason: I ran Linter.verify on a file matching the ignores and got one severity-1 'No matching configuration found' message rather than zero, so the specified zero-messages assertion cannot hold, and the plan specifies no positive control or count guard.
  - id: PLAN-VERIFY-010
    verdict: confirmed
    reason: gates.md and contract-pin.md name only two plants and leave scripts/contract/*.test.mjs unspecified, and the planted run of the && ciCommand stops at contract:check so test:contract is never exercised by a plant.
  - id: PLAN-VERIFY-011
    verdict: confirmed
    reason: contract-pin.md removes MissionPhase's name-conditioned allOf and allows /phases/<n>/basis, so a known-name phase with the wrong basis (strict error at that path) would pass the relaxed schema and hide behind the relaxation.
  - id: PLAN-VERIFY-012
    verdict: confirmed
    reason: C5 as written checks only lane counts, wpTotal and blockedCount, while the contract's x-derived rules for implement/review phase status and lifecycleStatus go unchecked, and the lane-open on_hold fixture has no stated tally rule against the closed nine-key counts.
  - id: PLAN-VERIFY-013
    verdict: confirmed
    reason: research D-11 requires every fixture export to end satisfies a view type, but data-model.md defines no page view type (only MissionOverviewView), so host-kind pageMixed/pageFull/pageLast carrying stale would fail satisfies MissionOverviewPage with excess-property TS2353.
