findings:
- id: plan-correct-001
  lens: Types
  severity: 4
  title: Widening the retry union breaks typecheck in sk-work-package-screen.ts and the exhaustive switch
    in wp-retry-union.test.ts; neither file is in IC-02
  evidence:
  - code: packages/mission-ui/src/elements/sk-work-package-screen/sk-work-package-screen.ts:306-315 (retryLoad
      and retryPayload take SkRetryLoadDetail['target'] and call retryDetail)
  - code: packages/mission-ui/src/logic/wp-retry.ts:retryDetail parameter is the two Work Package members
      only
  - code: 'packages/mission-ui/test/wp-retry-union.test.ts: switch ending in `never`'
  claim: SkRetryLoadDetail is an alias of RetryLoadDetail. Adding three members widens `target`, so retryPayload(target)
    no longer type-checks against retryDetail, and the never branch in the test fails. The plan says the
    union gains three members in one file and lists neither knock-on.
  remediation: 'IC-02 owns two named edits: narrow the private parameter types to the Work Package members,
    and add one case per new member to the test. Builders go in a new logic/project-retry.ts. Add the
    files to the shared-files table.'
- id: plan-correct-002
  lens: Gates
  severity: 2
  title: D-05 says a re-vendor widens the data-driven gate with no edit; adding healthy as a bare word
    does need a config edit
  evidence:
  - code: 'eslint.data-driven.config.mjs: NEW_BARE_WORDS = [''changed'',''unknown'',''fresh'',''stale''].filter(...)
      is a literal list'
  - artifact: research.md D-05
  claim: Reading ProjectHealth.yaml puts healthy into NEW_WORDS (matched anywhere as a literal). The comparison-only
    treatment the plan intends needs healthy added to the literal bare list.
  remediation: State the edit in D-05, gates.md and IC-02.
- id: plan-correct-003
