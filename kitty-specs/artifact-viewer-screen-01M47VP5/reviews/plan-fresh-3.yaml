    remediation: "Add A-9 (vocabulary property, from PLAN-DESIGN-022 (a)) to the spec Clarifications bullet and the orchestrator log, or cite the fork id in the plan instead of a new amendment number; name the module that exports LISTING_MAX_ENTRIES (artifact-copy.ts or artifact-kinds.ts) in contracts/defaults.md."
