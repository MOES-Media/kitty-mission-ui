  refute_reason: feat/work-package-screen-5 status.json shows WP01-WP09 approved and WP10 in progress, lane-j holds RetryLoadDetail/SkRetryLoadDetail, REVIEW_CYCLE_ARTIFACT_KIND and factsSheet, and nothing
