  - artifact: 'contracts/gates.md self-check: ''The screen file compares no mediaType, kind or code'''
  claim: 'The screen''s willUpdate must decide whether to call buildMarkdownModel before resolveArtifactView has said whether the file is markdown. Either the screen compares mediaType (breaking its own
    rule and the data-driven intent), or it parses every document, including 256 KiB JSON or YAML, as markdown and discards the result (a wasted parse that can also produce a fallback no one shows). The
    cache key is content identity: a host that rebuilds the content object per render (a spread, a structuredClone, a fresh fetch of the same text) re-parses a 256 KiB document each time and the NFR-006
    ''no re-parse'' proof (node identity) holds only for a stable object. The entryPaths Set that classifyLink needs (''built once per listing'') is a second cache that the plan never places.'
  remediation: 'Put the decision in logic: add a pure markdownFor(content) (or give resolveArtifactView a lazy thunk) that returns null unless content.mediaType equals MARKDOWN_MEDIA_TYPE, and have willUpdate
    call only that. Key the cache on the pair (content.content string, content.mediaType) by value, not on object identity, and say so in D-07. Name the second cache (listing identity to the path-to-kind
    Map) in the same willUpdate paragraph. Add one test per cache: same string in a new object does not re-parse; non-markdown never reaches parse.'
  lens_group: design
  refute_reason: D-07 and sk-artifact-screen.md item 7 key the parse cache on content object identity, resolveArtifactView takes the already-parsed markdown while gates.md says the screen compares no mediaType,
    and the per-listing entryPaths Set is mentioned only as "built once per listing" with no placement.
