schema: review-findings/v1
phase: plan
note: 'confirmed findings with ONE valid remedy: the R4 fix list (forks excluded)'
findings:
- id: PLAN-CORRECT-002
  lens: correctness-and-contract-fidelity
  severity: 4
  title: '''noInlineConfig stays on'' is false for the general ESLint config, so the new security rules can be disabled in-source'
  evidence:
  - artifact: research.md D-06 ('scoped to packages/*/src/** with noInlineConfig') and contracts/gates.md ('noInlineConfig stays on')
  - code: eslint.config.mjs:21 (export default tseslint.config(...) has no linterOptions.noInlineConfig anywhere in the file)
  - code: 'eslint.no-io.config.mjs:149 and eslint.data-driven.config.mjs:97 (the only two configs that set noInlineConfig: true; eslint.no-io.config.mjs:12 and :4 explain why)'
  claim: 'The plan places the markdown-renderer rules (D-06 rules 1 to 5, the FR-005 proof that no innerHTML, unsafeHTML or DOMParser path exists) in eslint.config.mjs and says noInlineConfig ''stays on''.
    It is not on there: it is set only in the no-io and data-driven configs. A single eslint-disable-next-line comment above a violating line in render.ts therefore silences all five rules; the no-io config
    comment records that this bypass was reproduced (E-07). The ESLint plant only plants a DOMParser use without a disable comment, so it would not catch the bypass. The corpus test is the backstop, but
    FR-005 names the lint rule as the proof.'
  remediation: 'State that IC-04 adds linterOptions: { noInlineConfig: true } in an eslint.config.mjs block that covers packages/*/src/** (grep shows no eslint-disable in packages today, so nothing existing
    breaks), and add a self-test case in which an eslint-disable-next-line above a banned construct still reports (a leak case, as the no-io selftest has). Correct the ''stays on'' wording in research D-06
    and gates.md.'
  lens_group: correct
  refute_reason: grep shows noInlineConfig only in eslint.no-io.config.mjs:149 and eslint.data-driven.config.mjs:97, none in eslint.config.mjs, so "stays on" in gates.md and research D-06 is false.
- id: PLAN-CORRECT-003
  lens: correctness-and-contract-fidelity
  severity: 3
  title: refusal-code-open relaxation is specified against the wrong part of the ArtifactRefusal schema (code IS an enum)
  evidence:
  - artifact: research.md Evidence ('code is NOT an enum property of its own, which is why the unknown-code fixture needs a relaxation, D-10')
  - artifact: contracts/contract-pin.md step 5 ('the ArtifactRefusal if/then branches are not applied to a fixture whose code is not one of the seven')
  - code: 'contract (spec-kitty main 2261ad5) contracts/mission-status/schemas/ArtifactRefusal.yaml last allOf entry: properties.code $ref ArtifactRefusalCode.yaml; schemas/ArtifactRefusalCode.yaml is a
      7-value enum'
  - code: 'scripts/contract/registry.mjs (RELAXATIONS: patch(schema) + allowedPath regex checked against STRICT errors) and scripts/contract/check.mjs checkFixtureDoc (relaxed branch)'
  claim: ArtifactRefusal.code is $ref ArtifactRefusalCode, a closed seven-value enum, in the last allOf branch. The if/then branches (const code -> const status) never fire for an unknown code, because
    their 'if' is false. So the only strict error for an unknown-code fixture is /code (enum), and the relaxation must patch that property. The plan's stated rationale and mechanism ('if/then branches are
    not applied') are wrong; an implementer following contract-pin.md would write a patch that leaves the strict validator error in place, so the relaxed validator still fails and check C4 reports 'fails
    even the refusal-code-open schema'.
  remediation: 'Rewrite research.md Evidence and contract-pin.md step 5: the relaxation patches the code property of the ArtifactRefusal schema (the last allOf entry) to { type: string, minLength: 1 },
    with allowedPath /^\/code$/ (the only strict error an unknown code produces) and the reverted-must-fail proof of the existing relaxations'' shape. Name the status for the unknown-code fixture (any 4xx
    or 5xx integer satisfies Problem).'
  lens_group: correct
  refute_reason: ArtifactRefusal.yaml last allOf entry refs ArtifactRefusalCode.yaml (7-value enum), so research.md line 11 "NOT an enum" and the if/then-not-applied mechanism are wrong; the enum on /code
    is the strict error.
- id: PLAN-CORRECT-004
  lens: correctness-and-contract-fidelity
  severity: 3
  title: IC-01 verification figures are wrong against the real tree (151 files, 13 artifact examples) and would refuse a correct sha
  evidence:
  - artifact: plan.md header, Summary, Scale/Scope, IC-01; research.md Evidence ('161 files', 'fourteen examples'); contracts/contract-pin.md step 1 ('the fourteen artifact examples; a sha that lacks them
      is refused')
  - code: 'contract (spec-kitty main 2261ad5, git tree, blobs only): contracts/mission-status 142 + contracts/_shared 9 = 151 files; Artifact examples = ArtifactContent x4 + ArtifactListing x2 + ArtifactRefusal
      x7 = 13'
  - code: contract schemas/ArtifactRefusalCode.yaml, ArtifactReference.yaml, ArtifactReferences.yaml (nine schemas/Artifact*.yaml, not six or seven)
  claim: 161 is the count of git tree entries including directories (148 + 13); the vendorable file count at 2261ad5 is 151. There are 13 artifact examples (the plan's own fixture list says 13), not 14.
    contract-pin.md step 1 makes 'fourteen artifact examples' an acceptance condition of the sha, so a correct main sha fails the check the plan prescribes. The schema list in step 1 also omits ArtifactRefusalCode,
    the schema that defines the seven codes, and lists no ArtifactReference(s).
  remediation: Replace 161 with 151 everywhere (plan.md header, Summary, Scale/Scope, IC-01 and Merge-order paragraph; research.md; contract-pin.md) or better, state the figures as 'read from the pinned
    tree'. Change step 1 to '13 artifact examples' and add schemas/ArtifactRefusalCode.yaml to the required list; verify with a blobs-only count (git ls-tree -r) and not the tree-entry count.
  lens_group: correct
  refute_reason: A blobs-only tree at 2261ad5 gives 151 files and 13 artifact examples, while contract-pin.md step 1 requires "fourteen" examples and says 161 files and "six" schemas.
- id: PLAN-CORRECT-005
  lens: correctness-and-contract-fidelity
  severity: 3
  title: Supply-chain record lists @types packages that markdown-it 15.0.2 does not pull and omits the second uc.micro
  evidence:
  - artifact: plan.md Technical Context ('@types/mdurl 2 and @types/linkify-it 5' as transitive) and contracts/contract-pin.md step 6 ('new entries are exactly the transitive set of plan.md')
  - code: 'npm registry metadata: markdown-it@15.0.2 dependencies = mdurl ^2.1.0, argparse ^3.0.0, entities ^8.0.0, uc.micro ^3.0.0, linkify-it ^6.0.0, punycode.js ^2.3.1; linkify-it@6.0.0 depends on uc.micro
      ^2.0.0; mdurl 2.1.0 and linkify-it 6.0.0 ship their own types'
  claim: '@types/mdurl and @types/linkify-it are not in the dependency tree of 15.0.2 (the two packages ship their own declarations), while linkify-it 6.0.0 brings uc.micro ^2.0.0, so the lockfile holds
    two uc.micro majors (2.x and 3.0.0). The IC-01 exit check ''lockfile reviewed, the new entries are exactly the transitive set of plan.md'' therefore cannot be satisfied as written, and the FR-043 licence
    list that goes into the PR description would name two packages that are not installed and omit one that is.'
  remediation: Replace the transitive list with the one read from the lockfile after pnpm install (mdurl 2.1.0, argparse 3.0.0, entities 8.0.0, uc.micro 3.0.0 and uc.micro 2.x, linkify-it 6.0.0, punycode.js
    2.3.1) with the licence of each, drop the two @types entries, and make the IC-01 check 'lockfile additions equal the set printed by pnpm why markdown-it' instead of a hard-coded list.
  lens_group: correct
  refute_reason: npm metadata shows markdown-it 15.0.2 has no @types dependency, mdurl 2.1.0 and linkify-it 6.0.0 ship their own types, and linkify-it 6.0.0 depends on uc.micro ^2.0.0, yet plan.md lists
    @types/mdurl and @types/linkify-it.
- id: PLAN-CORRECT-006
  lens: correctness-and-contract-fidelity
  severity: 3
  title: The shell tree renders no 'unavailable' word for a leaf, and D-16 does not say who supplies it (FR-020, AV-16)
  evidence:
  - artifact: spec.md FR-020, US3 AC2, AV-16 ('row disabled and the word present'); plan.md D-16 ('unavailable is !readable'); spec Assumptions ('the shell tree needs no change for ... an unavailable row')
  - code: packages/mission-ui/src/elements/sk-shell-tree/sk-shell-tree.ts:190 (route is false when unavailable) and :189-200 (leaf draws icon, label and node.meta only; no word)
  - code: 'packages/mission-ui/src/elements/sk-shell-tree/fixtures.ts:8 (the existing unavailable leaf carries meta: ''planned'' as its visible word)'
  claim: For unavailable === true the shell only drops the link and the selected state; the only visible text beside the label is node.meta. buildArtifactTree as designed (D-16, defaults.md) sets unavailable
    from !readable and a folder meta count, but no step sets the leaf meta to the word 'unavailable' (UNAVAILABLE_TEXT exists in artifact-copy.ts but nothing consumes it for the tree). As specified the
    unreadable row would be silently inert with no word, failing AV-16 and NFR-011 (state never colour-only).
  remediation: 'Add to D-16 and to the IC-02 tests: for a leaf with readable false, buildArtifactTree sets unavailable: true and meta: UNAVAILABLE_TEXT (through the kind/refusal-independent label hook,
    raw fallback), and a unit test asserts it. Correct the spec assumption wording in the plan''s traceability (the shell needs no change, the helper must supply the word).'
  lens_group: correct
  refute_reason: sk-shell-tree renderLeaf draws only label and node.meta for an unavailable leaf, and D-16 sets only unavailable from !readable with no step assigning the word "unavailable" to meta, so
    AV-16 has no supplier.
- id: PLAN-CORRECT-007
  lens: correctness-and-contract-fidelity
  severity: 3
  title: Contract says unknown status collapses to the default via normaliseViewState, but that helper maps unknowns to 'empty' and knows only four values
  evidence:
  - artifact: "contracts/sk-artifact-screen.md \xA7 Properties ('An unknown status, contentStatus or view value collapses to the default (the shell's normaliseViewState pattern)') and \xA7 Dependencies\
      \ (normaliseViewState listed as an imported #4 symbol)"
  - artifact: data-model.md Screen properties (status default loading; six status values)
  - code: packages/mission-ui/src/view-state.ts:2-9 (VIEW_STATES has four values; normaliseViewState returns 'empty' for anything else)
  claim: 'Imported as listed, normaliseViewState would turn the screen''s two extra statuses (not-found, nothing-selected) into ''empty'', and would send an unknown status to ''empty'', not to the declared
    default ''loading''. The ''pattern'' wording and the ''imported symbol'' list contradict each other and neither matches the stated default. The contentStatus and view properties have no normaliser at
    all in #4.'
  remediation: 'State that IC-06 writes the screen''s own normalisers (a closed list per property and an explicit fallback: status -> loading, contentStatus -> ready, view -> rendered) in a small logic
    module (tested with an unknown value per property), and remove normaliseViewState from the imported-symbols list. Add the unknown-value case to the surface-freeze or skeleton tests.'
  lens_group: correct
  refute_reason: view-state.ts has four VIEW_STATES and normaliseViewState falls back to 'empty', contradicting the contract's collapse-to-default (loading) wording and the six-status screen while the contract
    lists it as an imported symbol.
- id: PLAN-CORRECT-008
  lens: correctness-and-contract-fidelity
  severity: 3
  title: Plan assumes a node-environment vitest project for pnpm test; the repo has only browser mode, and the bundle-budget and source-scan tests cannot run there
  evidence:
  - artifact: plan.md Technical Context ('vitest node environment for the pure logic/markdown/ model'), IC-03 exit ('pnpm test node-environment files'), IC-04 ('test/bundle-budget.test.ts'), IC-03 source-level
      scan test
  - artifact: research.md D-05 and 'Not verified' (bundler importable from packages/mission-ui; fallback to a scripts/ node test)
  - code: packages/mission-ui/vitest.config.ts:4-16 (test/**/*.test.ts, browser.enabled true, chromium only; no node project)
  - code: gates/vitest.config.ts:7-9 (the node environment exists only for gates/*.selftest.ts)
  - code: 'package.json scripts: test = pnpm --filter @spec-kitty/mission-ui test; test:scripts does not include the package tests'
  claim: Every file under packages/mission-ui/test runs in Chromium. A test that builds a bundle (esbuild or vite API), reads files with node:fs (the 'markdown-it is imported by parse.ts alone / no .render(
    call' text scan) or times S-A0-style parses in node cannot run there, and IC-03/IC-04 give no file or script change that adds a node project (vitest.config.ts is not in any WP's write scope in the Shared
    files table). The existing defaults.test.ts shows the available workaround (?raw imports), which the plan does not use.
  remediation: 'Decide and write down one mechanism. (1) Keep everything in browser mode: the source scan uses import.meta.glob(''../src/**/*.ts'', { query: ''?raw'' }); the bundle-budget check moves to
    a node script under scripts/ with a node:test file wired into an existing CI gate (name the gate) and the plan stops calling it a unit-tests test. Or (2) add a second vitest project (environment node)
    and assign vitest.config.ts and the test script to IC-01 in the Shared files table. Update IC-03 and IC-04 exit checks accordingly.'
  lens_group: correct
  refute_reason: packages/mission-ui/vitest.config.ts has only a chromium browser instance with no node project, yet plan.md Technical Context, IC-03 and IC-04 assume node-environment vitest files and a
    bundle-budget test, with no WP owning a config change.
