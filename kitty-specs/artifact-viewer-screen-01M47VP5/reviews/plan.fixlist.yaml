    \ maximum of token.level (and open/close nesting) over all of them, and that the check runs BEFORE the model recursion, which must not recurse past maxDepth. Add three corpus entries: matched alternating\
    \ nested emphasis/strong/strike (>= 25 and 40,000 deep), 60,001 inline tokens inside a single paragraph, and a table cell with deep inline nesting. Wrap the Lit render of the model in the same fail-closed\
