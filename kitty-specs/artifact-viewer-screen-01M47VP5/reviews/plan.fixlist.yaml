- id: PLAN-DESIGN-003
  lens: module design
  severity: 3
  title: Markdown parse trigger is circular with the rule that the screen compares no media type; cache key is the content object
  evidence:
  - artifact: 'data-model.md ''ArtifactView'': resolveArtifactView receives markdown: MarkdownResult | null and itself decides markdown from mediaType; plan.md IC-06 ''the parse cache in willUpdate''; research.md
