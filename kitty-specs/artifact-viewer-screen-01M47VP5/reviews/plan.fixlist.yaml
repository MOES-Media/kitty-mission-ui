    yet) with the commit read, and keep ''the orchestrator re-verifies at dispatch''. Replace hypothetical rows with the verified symbols (RetryLoadDetail / SkRetryLoadDetail, REVIEW_CYCLE_ARTIFACT_KIND
    typed as ArtifactKind in defaults/review.ts, factsSheet, the sk-open-artifact payload) and rename SkWorkPackageRetryDetail to the alias that exists.'
