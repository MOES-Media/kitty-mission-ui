  - code: '<spec-kitty-mission-ui clone>: git show feat/work-package-screen-5:kitty-specs/work-package-screen-01M44DSJ/status.json (WP01 to WP09 approved, WP10 in_progress; commit cd29bc5 at 2026-10-06
      08:09 +0200, about one minute before this plan''s commit c3e14e5)'
  - code: '<spec-kitty-mission-ui clone>: branch kitty/mission-work-package-screen-01M44DSJ-lane-j holds elements/sk-work-package-screen/*, defaults/review.ts (REVIEW_CYCLE_ARTIFACT_KIND), logic/wp-retry.ts
      (RetryLoadDetail), library-sheets.ts with factsSheet'
  claim: 'The sentence is true only of the target branch feat/work-package-screen-5 itself: the implementation lives in the mission and lane branches (kitty/mission-work-package-screen-01M44DSJ and its
    lane-a to lane-j) and is nearly finished (9 of 10 approved). The plan therefore tells the operator that Base B is distant and that every dependency in the ''what this mission needs from #5'' table is
