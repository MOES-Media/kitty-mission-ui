- id: PLAN-DESIGN-022
  lens: dynamic-pipeline alignment
  severity: 3
  title: 'FORK: the labels hooks cover words only, so icons, Work Package link kinds, container segment, copy and budget cannot arrive as props although the spec says they come in as data'
  evidence:
  - artifact: spec.md 'The dynamic-pipeline constraint' ('Artifact kind words, kind icons, folder names, media-type labels, refusal wording, the render budget and badge tones come in as data' and 'a later
      pipeline ... must need no change to this element, only different props'); FR-031 (tab labels and notices come from defaults/ or the labels property)
  - artifact: 'contracts/defaults.md: ARTIFACT_KIND_WORDS icon, WORK_PACKAGE_LINK_KINDS, WP_CONTAINER_SEGMENT, TOKEN_SEPARATOR, MARKDOWN_BUDGET, EXTERNAL_LINK_SCHEMES, MARKDOWN_MEDIA_TYPE are module constants;
      hooks are kind, refusal, mediaType, size (strings only)'
  claim: The only runtime inputs are string hooks. A pipeline that adds a kind cannot give it an icon, cannot declare that its files link a Work Package, cannot move the container segment, and cannot change
    tab labels or notices, because none has a property or hook; they change only by editing defaults/, i.e. the element. The same holds for the budget. That is 'defaults, not data in', which is how the
    board handles lanes only for words. The plan restates the spec sentence in D-20 as satisfied without noting the gap.
  remediation: 'FORK: (a) add one optional structural input, for example a vocabulary property typed ArtifactVocabulary (kind table with label and icon, wpLinkKinds, container segment, markdown media type,
    tab and notice copy) that defaults to the defaults/ module, and have the logic functions take it as an argument; (b) keep constants in defaults/ and record in the spec, by amendment A-5 at CP-1, that
    only words are runtime data and that structure constants are defaults-only until the dynamic pipeline mission. Either way correct D-20 and FR-031 so they state which inputs are props.'
  lens_group: design
  refute_reason: defaults.md confirms icon, WP link kinds, container segment, budget and copy are module constants while only string hooks (kind, refusal, mediaType, size) are runtime inputs, contradicting
    the spec's data-in claim; FORK stands.
- id: PLAN-A11Y-001
  lens: visual-fidelity / container thresholds (A-1, DA-33, S-A6)
  severity: 4
  title: The 689 px two-column container threshold flips back to two columns in the shell's mobile tier (viewports 689 to 719 px), and S-A6 does not sample there
  evidence:
  - artifact: 'plan.md:93-99 (table: min-width 689 two columns; max-width 688 one column; third row ''below the shell''s mobile tier width (about 620 px viewport)'')'
  - artifact: contracts/sk-artifact-screen.md:39 (thresholds 688/689 'from the prototype's 800 px viewport on the collapsed shell tier (viewport minus 112)')
  - artifact: research.md:122 (S-A6 measures at 1280, 1100, 800, 620 px only)
  - code: packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:33-34 (EXPANDED_QUERY min-width 1100px, COLLAPSED_QUERY min-width 720px)
  - code: 'packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:156-169 (mission layout: expanded = rail + 240px sidebar + 1fr, collapsed = rail + rail + 1fr; mobile tier has no extra column,
      so the content cell equals the viewport)'
  - code: 'packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:455-465 (readTier: below 720 is ''mobile'')'
  - artifact: prototype screens-opendesign-v2/prototype.css:922-929 (reading-layout one column at max-width 800px viewport) and :947-948 (toolbar stack and table block at max-width 620px)
  claim: 'The tier arithmetic in the plan is right for the two wide tiers (verified: expanded cell = viewport - 296 = rail 56 + sidebar 240; collapsed cell = viewport - 112 = rail 56 + icon column 56; both
    from the shell grid and the prototype layout tokens). It is wrong for the third. Below 720 px the shell is in its mobile tier and the content cell is the full viewport width, not viewport minus 112.
    The cell width therefore is not monotonic in the viewport: 1099 px gives 987, 1100 gives 804, 800 gives 688, 720 gives 608, 719 gives 719. A single container rule "two columns from 689 px" then produces,
    for viewports 689 to 719 px, two columns with a 419 px document next to a 270 px inspector, then one column again from 720 to 800 px, then two columns again from 801 px. The prototype is one column
    for every viewport of 800 px or less. The same asymmetry hits the toolbar stack: prototype stacks at viewport <= 620; a container rule "cell <= 620" also fires at viewports 720 to 732 (collapsed tier,
    cell 608 to 620) where the prototype does not stack. Plan row 3 calls 620 px "the shell''s mobile tier width", but the shell''s mobile tier starts below 720 px; 620 is the prototype''s own breakpoint.
    The IC-06 layout test cases (1280, 1100, 800, 620) and the AV stories never visit 689 to 719 or 720 to 732, so the defect would pass every gate and the drift would be a REJECT only if a reviewer happened
    to look.

    '
  remediation: 'FORK: choose how the container thresholds map to the prototype''s viewport behaviour.

    (a) Raise the two-column minimum so it cannot be reached in the mobile tier and stays monotonic across the collapsed tier: for example two columns from a cell of 720 px (viewport 832 on the collapsed
    tier, 720 to 799 never two columns on mobile because the cell is < 720 only up to 719). Record the 801 to 831 px window as confirmed drift in DA-33 at CP-1. Likewise pick the toolbar-stack threshold
    so it also holds in both tiers, or accept and record the 720 to 732 window.

    (b) Keep 688/689 as is and record, as DA-33 drift, that the viewport window 689 to 719 shows two columns; not recommended (a 419 px document column).

    (c) Amend FR-036 to allow one narrow viewport media query (800 px) for the column switch, which reproduces the prototype exactly; this contradicts the spec''s "not viewport media queries" and needs
    the operator.

    In all cases: extend S-A6 to sample 689, 719, 720, 732, 799, 800, 801, 831, 832, 1099 and 1100 px in both shell tiers and write the cell width at each into contracts/sk-artifact-screen.md; add layout
