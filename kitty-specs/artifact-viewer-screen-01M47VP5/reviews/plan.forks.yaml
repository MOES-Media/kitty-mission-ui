findings:
- id: PLAN-CORRECT-001
  lens: correctness-and-contract-fidelity
  severity: 4
  title: Renderer lint rule 2 bans .set( / .use( / .enable( / .disable( across packages/*/src and would fail existing code
  evidence:
  - artifact: "contracts/gates.md \xA7 Lint rules for the renderer (rule 2: '.enable(, .set(, .disable( only in parse.ts ... Rules apply to packages/*/src/**')"
  - artifact: research.md D-06 (2)
  - code: packages/mission-ui/src/elements/sk-shell-tree/sk-shell-tree.ts:155 and :181 (this.openState.set(...))
  - code: packages/mission-ui/src/logic/summary.ts:14 (owner.set(lane, group))
  claim: 'FORK: the rule as written is a name-based no-restricted-syntax selector on member calls named set, use, enable and disable, scoped to every file under packages/*/src except parse.ts. Map.prototype.set
    is called in existing, merged code (sk-shell-tree.ts:155 and :181, logic/summary.ts:14), so the rule turns pnpm lint red on the base before this mission writes a line, and every future Map.set in buildArtifactTree
    or the link resolver. An implementer would have to narrow the rule ad hoc, which is exactly the kind of un-reviewed weakening of a security gate the plan wants to prevent. A selector cannot tell a markdown-it
    instance from a Map.'
  remediation: 'Two valid options, pick one in the plan. (a) Scope rule 2''s set/use/enable/disable selectors by file glob to src/logic/markdown/** (minus parse.ts) and src/elements/sk-artifact-screen/**,
    and keep render/renderInline/ renderToken/renderAttrs/.renderer repo-wide; add a leak case that proves the narrowed glob still refuses .use( in model.ts. (b) Drop set/use/enable/disable from the lint
    list and make the guarantee structural: parse.ts exports only parseTokens(source) and never the MarkdownIt instance, which rule 1 (import allowed only in parse.ts) plus an export-shape test (parse.ts
    has exactly one export) enforce. Either way, add an IC-04 exit check that pnpm lint is green on the unchanged base files.'
  lens_group: correct
  refute_reason: FORK stands; gates.md rule 2 bans .set( outside parse.ts across packages/*/src and sk-shell-tree.ts:155,181 and logic/summary.ts:14 call Map.set on the merged base.
- id: PLAN-CORRECT-009
  lens: correctness-and-contract-fidelity
  severity: 3
  title: 'Proposed exceptions E-22 to E-24 cannot express the renderer''s CSS: ch unit unsupported, text-align, code white-space and list properties missing'
  evidence:
  - artifact: 'contracts/gates.md E-22 (''max-width: 68ch''), E-23, E-24; contracts/markdown-renderer.md (data-align keyword attribute, pre/code blocks, ul/ol/li, hr)'
  - code: 'stylelint.config.mjs:414 (''unit-allowed-list'': [''%'', ''fr'']) and :355-361 (exceptions can unlock only px and em through pxProperties and emProperties)'
  - code: stylelint.config.mjs:60-148 (property-allowed-list is LAYOUT_PROPERTIES only; text-align, white-space, list-style, vertical-align, font-style, text-decoration, cursor are not in it)
  claim: 'FORK: (1) E-22 pins ''max-width: 68ch'', but the exception machinery has no way to allow the ch unit (only px and em exist as unit grants), so E-22 as approved at CP-1 cannot be encoded without
    a tooling change the plan does not mention. (2) The renderer emits data-align (left, center, right) on table cells, which needs text-align, absent from E-23''s allowed properties and from LAYOUT_PROPERTIES.
    (3) Rendered fenced and indented code (pre code in prose-styles.ts) needs white-space and overflow handling, but E-24 grants white-space only to source-parts.ts. (4) lists and block quotes need list-style,
    padding-inline-start, font-style, which are not listed. An exception discovered after CP-1 is a new operator decision mid-implementation.'
  remediation: 'Complete the E-22 to E-24 tables before CP-1 from the markdown-renderer.md element list (add text-align with keyword values left, center, right; white-space and overflow-wrap keywords for
    code in prose-styles.ts; the list and quote properties actually needed; vertical-align if kept). For 68ch choose one: (a) add a chProperties grant to exceptionOverrides() (IC-06 tooling edit with proof
    cases, named in the plan) or (b) express the paragraph measure without the ch unit (for example a token-based max-width, S-A1 decides) and drop 68ch from E-22.'
  lens_group: correct
  refute_reason: FORK stands; stylelint.config.mjs unit-allowed-list grants only %, fr, px, em (no ch) and LAYOUT_PROPERTIES has no text-align, while E-22 pins max-width 68ch and E-23/E-24 omit text-align
    for data-align cells and white-space for prose code.
- id: PLAN-CORRECT-013
  lens: internal-consistency-and-feasibility
  severity: 3
  title: 'Write-scope disjointness broken: the truncation note lives in document-parts.ts (IC-07, chain X) but is assigned to IC-09 (chain Y)'
  evidence:
  - artifact: "plan.md IC-09 ('the truncation note (DA-10) in the document pane header band. FR-021') versus IC-07 ('toolbar-parts, tab-parts, document-parts, source-parts, prose-styles') and \xA7 Shared\
      \ files ('every *-parts.ts: the owning WP replaces stub bodies')"
  - artifact: "contracts/sk-artifact-screen.md \xA7 Part signatures (renderDocument(...) 'rendered body, the redaction line, the truncation note') and \xA7 Regions (document-pane: truncation note)"
  claim: 'FORK: renderDocument in document-parts.ts owns the truncation note, and that file is IC-07''s. IC-09 is declared parallel to chain X with disjoint writes and its affected surface is inspector-parts.ts
    only, yet it must make AV-17 pass, whose note renders in the document pane. Either IC-09 edits document-parts.ts (breaking disjointness and risking the merge the orchestrator performs before IC-10)
    or AV-17 cannot pass in chain Y.'
  remediation: Two valid options. (a) Move the truncation note into IC-07's scope (it already owns renderDocument and the redaction line), leaving IC-09 only the AV-17 story and its test, which reads the
    note through the screen. (b) Create a separate stub part (for example listing-note-parts.ts, signature in 'Part signatures') in IC-06 and assign it to IC-09. Update IC-07/IC-09 text, FR mapping and
    the Shared files table to match.
  lens_group: correct
  refute_reason: FORK stands; contract Part signatures put the truncation note in renderDocument (document-parts.ts, IC-07 chain X) but plan IC-09 (chain Y, inspector-parts.ts only) is assigned the truncation
    note in the document pane header band.
- id: PLAN-SECURE-009
  lens: unicode-spoofing
  severity: 2
  title: R-09 cites the raw tab as a mitigation, but the raw tab shows bidirectional controls invisibly and reorders identically
  evidence:
  - artifact: 'research.md R-09 (''accepted residual: text is shown as it is; the raw tab shows the same characters'')'
  - artifact: research.md D-15 (raw is one pre text binding)
  claim: 'The raw tab renders U+202E, U+2066 to U+2069 and similar as zero-width format controls, so it displays the same reordered text as the rendered tab and reveals nothing; it is not a mitigation.
    For a viewer whose documents are agent-written, link text and the inert-link title are exactly where reordering misleads (and external-link destinations are hidden, see PLAN-SECURE-004). The residual
    is a legitimate operator decision, but the plan records it with a wrong justification, and it was recorded for CP-1 without an option.

    '
  remediation: 'FORK: (a) correct R-09 to ''accepted, no mitigation'' and have the operator rule at CP-1; (b) in the raw and fallback pre only, render U+202A to U+202E, U+2066 to U+2069 and U+200E/F as
    visible replacement glyphs (text transform in source-parts.ts, data-held code point list); (c) additionally wrap each document text container in dir=''auto'' with the CSS ''unicode-bidi: isolate'' so
    overrides cannot leak across blocks. Recommend (a) plus (b).

    '
  lens_group: secure
  refute_reason: research.md R-09 cites "the raw tab shows the same characters" while D-15 makes raw a plain pre text binding, which applies the same bidi reordering, so it is no mitigation and no option
    was recorded.
- id: PLAN-DESIGN-002
  lens: module design
  severity: 3
  title: The shared sk-retry-load union has no neutral home and requires editing
  evidence:
  - artifact: 'research.md D-04 (''The edit to #5''s one declaration is made by IC-06 if #5 is present''); plan.md ''Build base'' table row sk-retry-load; contracts/sk-artifact-screen.md ''Events'''
  - artifact: '#5 contracts/sk-work-package-screen.md Events table: sk-retry-load payload { missionId, wpId, target } declared by the Work Package screen (read from feat/work-package-screen-5)'
  - code: 'packages/mission-ui/src/elements/sk-mission-sample/sk-mission-sample.ts:10 and :26 (the existing pattern: the payload type and the @fires live in the one declaring element)'
  claim: 'One HTMLElementEventMap key (sk-retry-load) must have exactly one declare global. The plan makes the key''s single declaration live in #5''s screen file and has this mission''s IC-06 rewrite it
    to a union. That file is outside IC-06''s write scope (the Shared files table never lists sk-work-package-screen.ts), it only exists on base A or after #5 is implemented, and on base B-without-code
    the mission invents a declaration that #5 must later adopt. Two elements each owning half of one shared type, with the edit direction depending on landing order, is the opposite of one home. SkRetryLoadDetail
    also appears in the #5 defaults contract (retryDetail returns SkRetryLoadDetail), so renaming it to SkWorkPackageRetryDetail ripples into #5''s tasks.'
  remediation: 'FORK: (a) a neutral file, for example src/retry-types.ts (as shell-types.ts is neutral for shell events), exporting SkWorkPackageRetryDetail, SkArtifactRetryDetail, the union SkRetryLoadDetail
    and the single declare global; both screens import it, and whichever mission lands first creates it (the second only adds its member). Recommended. (b) keep #5''s file as the home and make the edit
    a named, reported exception in the Shared files table with the exact one-line diff. Whichever is chosen, add the file or the row to the Shared files table and to the merge-order list.'
  lens_group: design
  refute_reason: research.md D-04 has IC-06 edit
- id: PLAN-DESIGN-005
  lens: module design
  severity: 3
  title: buildArtifactTree can hand the shell a current id that no row shows as selected, and an unreadable leaf cannot be opened
  evidence:
  - artifact: research.md D-16 ('unavailable is !readable', current = the selected leaf); D-04 (a link to an unreadable entry emits sk-select-artifact so the host shows the refusal); plan.md IC-02 'the
      selected leaf current'
  - code: packages/mission-ui/src/elements/sk-shell-tree/sk-shell-tree.ts:189-190 (a leaf is a route only when unavailable is not true and href is non-empty; selected is route && id === current)
  - code: packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:494-501 (any non-empty tree.current removes aria-current from the nav item)
  claim: 'For an entry with readable false the helper marks the node unavailable. The shell then renders it as a non-link row with no click handler (so a user cannot select it from the tree and see the
    refusal), and if the host nevertheless selects it (via a markdown link, which D-04 allows) current is non-empty, the shell clears aria-current on the nav item, and no tree row is selected: the page
    has no aria-current at all. The contract for current says ''the id of the selected leaf or empty'' with no rule for this case.'
  remediation: 'FORK: (a) never mark a leaf unavailable; keep it a normal selectable row with a text-bearing meta word (''unreadable'', from defaults/) so the refusal is reachable and aria-current stays
    true. (b) keep unavailable and return current '''' whenever the selected leaf is unavailable (so the shell keeps the nav item current), and document that unreadable entries are reached only by link.
    Add the case to the IC-02 tree tests and a shell-composition test.'
  lens_group: design
  refute_reason: 'Verified: sk-shell-tree selects only routes, and the shell clears aria-current on any non-empty current, so an unavailable selected leaf leaves no aria-current; FORK stands.'
- id: PLAN-DESIGN-006
  lens: module design
  severity: 3
  title: expandedIds write-back from sk-tree-toggle rebuilds the whole tree DOM and loses focus; ancestor-forced-open undoes a manual collapse
  evidence:
  - artifact: 'quickstart.md host snippet: tree.addEventListener(''sk-tree-toggle'', (e) => toggle(e.detail)) then buildArtifactTree(..., { expandedIds }); research.md D-16 (ancestors of the selection are
      expanded on every build, AV-19 ''documented trade-off'')'
  - code: packages/mission-ui/src/elements/sk-shell-tree/sk-shell-tree.ts (the items property doc 'Replacing the array resets folder state'), :163 (willUpdate resets openState on items change), :235 (keyed(this.items,
      ...) recreates every details element when the array identity changes)
  claim: buildArtifactTree returns a new nodes array on every call. If the host writes the toggled folder into expandedIds and rebuilds (the quickstart shows exactly that), keyed() throws away and re-creates
    every folder and leaf (up to 1000 entries), the focused summary element is destroyed, keyboard focus drops to the body, and the user's scroll position in the sidebar can reset. Separately, an ancestor
    of the selected path is forced open on each build, so the user cannot collapse the folder that contains the open file at all (the plan calls this a trade-off but it makes the toggle event pointless
    for that folder and, with write-back, produces a visible flicker). The plan never says whether the host must write back.
  remediation: 'FORK: (a) document that the host must NOT write toggles back: the shell tree keeps its own open state while items is stable, expandedIds is the initial and selection-driven state only, and
    the host rebuilds only when entries or selectedPath change (memoised on those identities); remove the write-back from quickstart. (b) keep write-back but make buildArtifactTree return the previous array
    when the output is structurally equal (an optional previous argument), and drop the forced-open rule for folders the user explicitly collapsed. Add a test in the shell composition: toggle a folder,
    the focused summary survives.'
  lens_group: design
  refute_reason: 'Verified: keyed(items) recreates all rows, quickstart writes toggles back and rebuilds, and D-16 forces ancestors open; FORK stands.'
- id: PLAN-DESIGN-013
  lens: data-driven gate
  severity: 3
  title: E-22 is not implementable with the existing exception mechanism (ch unit, unstrict, px on max-width) and the plan does not say the mechanism must change
  evidence:
  - artifact: 'contracts/gates.md E-22: ''pinned literals: max-width: 800px, max-width: 68ch, line-height: 1.65, text-decoration: underline, cursor: pointer'''
  - code: stylelint.config.mjs:13-41 (max-width and line-height are in STRICT_PROPERTIES), :414 (base unit-allowed-list ['%','fr']), :321-364 (the only unit grants are pxProperties and emProperties; no
      other unit can be granted), :326 and :339 (unstrict is the only way to take a strict property out)
  claim: 'max-width: 68ch needs the ch unit, which unit-allowed-list rejects and the EXCEPTIONS merge cannot grant (it knows only px and em). max-width and line-height are strict properties, so pinning
    them needs unstrict entries and the pinned-values form, which E-22 does not name. text-decoration and cursor are not in LAYOUT_PROPERTIES and need to be added to the property allow-list with pinned
    keywords. IC-06 owns this config and expects ''proof cases'', but would discover mid-work that the exception machinery needs a new unit grant, a change to a gate that the plan lists as unchanged.'
  remediation: 'Rewrite E-22 as a concrete EXCEPTIONS entry (files, properties, unstrict, values, pxProperties) and add to IC-06 an explicit sub-task ''add chProperties to the exception merge, with unit-allowed-list
    and declaration-property-unit-disallowed-list cases and a reverted-must-fail proof''. FORK for the measure: (a) extend the mechanism to ch (small, general); (b) express the paragraph measure with the
    reading-width token request G-19 and keep only max-width: 800px as px, dropping 68ch.'
  lens_group: design
  refute_reason: stylelint.config.mjs exceptionOverrides builds unit-allowed-list from only '%','fr' plus px/em via pxProperties/emProperties, so max-width 68ch cannot be granted, and E-22 does not name
    unstrict or a ch mechanism.
