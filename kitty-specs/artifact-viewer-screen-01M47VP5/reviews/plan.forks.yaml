  claim: 'Resource Timing entries are queued when a fetch COMPLETES (or fails), asynchronously; data: and blob: URLs produce no entry at all; a request to an unroutable remote host stays pending for seconds
    in CI, so a test that settles on `updateComplete` and then asserts "no entry" passes whether or not an `<img src>` was created. The plan has no positive control for this observer (R-08 is only applied
    to visible text), and the settle is unspecified. As written it is vacuous exactly for the regression it targets (an image renderer weakened to emit `<img>`), and the structural allowlist walk is the
    only real protection.'
  remediation: 'FORK: (a) replace the observer by a synchronous detector: a `<meta http-equiv="Content-Security-Policy" content="img-src ''none''; frame-src ''none''; object-src ''none''">` inserted in
    the test document before rendering plus a `securitypolicyviolation` listener (fires without network), with a positive control that a hand-built `<img src="http://example.invalid/x.png">` triggers it.
    (b) Keep the observer only as a secondary signal, using `buffered: true`, a documented settle (await a load/error on a planted control image rendered in the same harness), and a positive control with
    a same-origin URL that is known to exist; record that it is not the primary proof. Either way state in the corpus contract that assertion (1) and (3) (no img/src/href elements) are the proof of NFR-005
    and (4) is corroboration.'
  lens_group: test
  refute_reason: 'Assertion (4) is a bare PerformanceObserver with no positive control or settle, and Resource Timing cannot prove absence for pending or data: URLs (FORK stands).'
