- id: PLAN-DESIGN-017
  lens: build base and sequencing
  severity: 3
  title: 'FORK: the plan leaves Base A or B open, so five branch points make IC-01, IC-02 and IC-06 non-deterministic for task generation'
  evidence:
  - artifact: 'plan.md ''Build base'' (''The plan does not choose''); branch points: contracts re-vendor mechanism (--sha versus --from-repo), REVIEW_CYCLE_ARTIFACT_KIND (import versus define), sk-retry-load
      (edit #5 versus declare), exception numbering (E-17 to E-21 present or documented gap), facts sheet (exists or create), contract literals (#5''s counts)'
  claim: Each of those branch points changes which files an IC writes and which tests it carries, so the tasks phase cannot give exact owned_files or exit checks without picking a base. The plan's own statement
    that the orchestrator asks the operator at dispatch moves a design decision past planning, after the lanes and write scopes are fixed.
  remediation: 'FORK: (a) decide at CP-1 or before tasks: Base A only (IC-01 is blocked until #5 merges; state this as the entry condition, and shrink every branch point to the single present case); (b)
    keep both but add a delta table ''IC / Base A / Base B'' listing the exact file differences for the six branch points above, so tasks can be generated for either and the orchestrator picks one at dispatch.
    Recommended: (a), because #5 is planned and tasked and Base B has the highest rebase risk for the contract files.'
  lens_group: design
  refute_reason: FORK stands; plan.md Build base states 'The plan does not choose' between Base A and B and leaves the orchestrator to ask at dispatch, while its own table shows IC-01 file content varying
    by base (re-vendor mechanism, retry-load, E-17 to E-21 gap, REVIEW_CYCLE).
