- id: PLAN-TEST-003
  lens: vacuity
  severity: 3
  title: '"No request" assertion by PerformanceObserver cannot prove absence and conflicts with the no-wait rule'
  evidence:
  - artifact: 'contracts/markdown-renderer.md assertion (4): ''a PerformanceObserver records no resource load during render and a settle'''
  - artifact: 'research.md D-19: ''no setTimeout waits (updateComplete)''; R-08: every ''no X'' paired with a control rendering'
  - artifact: 'spec.md NFR-005: ''the document causes 0 network requests (asserted in the corpus test by observing resource loads)'''
