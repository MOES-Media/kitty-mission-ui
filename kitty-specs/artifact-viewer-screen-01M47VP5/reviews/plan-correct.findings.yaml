      content null, refusalCode null): ready with content null maps to pane 'loading' (spec edge case), refused with a
      null code to the generic refusal sentence (resolveArtifactRefusal(null) is defined), error with empty
      errorMessage to CONTENT_ERROR_DEFAULT; require one IC-02 test per row.

