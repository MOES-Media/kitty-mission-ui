  - id: PLAN-CORRECT-015
    lens: internal-consistency-and-feasibility
    severity: 3
    title: "Pairing rule (entry must exist in the listing) is violated by three of the four content examples against listingPopulated; unknown-kind 'listing and content' cannot be one fixture"
    evidence:
      - artifact: "contracts/contract-pin.md § Pairing ('where both a listing and a content are given, content.path must equal selectedPath, and the entry for that path must exist in the listing') and fixture inventory (listingUnknownKind 'one entry and its content')"
      - code: "contract (spec-kitty main 2261ad5) examples: ArtifactContent.redacted path notes/handoff.md, ArtifactContent.json path contracts/schema.json, ArtifactContent.empty path notes/empty.txt; ArtifactListing.populated has none of those paths (it has contracts/api.yaml, notes/big-export.json, notes/with space.md)"
      - code: "scripts/contract/registry.mjs:9-26 (one fixture = one document validated against one schema)"
    claim: >-
      AV-06, AV-07 and AV-08 use contentJson, contentEmpty and contentRedacted. With listingPopulated their paths are
      not entries, so the plan's own constraint forces either the 'selected path not in the listing' edge case (wrong
      for those rows: size and modified facts fall back, AV-24/R-12) or a paired listing the inventory does not
      contain. Separately, the registry holds one document per fixture, so 'listingUnknownKind: one entry and its
      content' is two fixtures (a listing and a content), only one of which is named.
    remediation: >-
      Add to the inventory a listing overlay that includes the three open paths (for example listingWithOpenFiles,
      valid against ArtifactListing, sorted in byte order) and use it for AV-06 to AV-08; split the unknown-kind
      overlay into listingUnknownKind and contentUnknownKind (both under artifact-kind-open); recount the fixtures
      and update registry.test.mjs and overlays.test.mjs literals in IC-01 accordingly.

  - id: PLAN-CORRECT-016
    lens: internal-consistency-and-feasibility
    severity: 3
    title: "Fixture inventory lists bulk-generated documents as generated export names while saying they are never stored"
    evidence:
      - artifact: "contracts/contract-pin.md § Fixture inventory ('names are the generated export names': listingThousand, contentLarge, contentLongLine, contentFallback) and the sentence 'Generated documents ... are produced at import time by bulk.ts functions, never stored (size, FR-044)'"
      - code: "scripts/contract/generate.mjs:41-57 (every registry entry is written as a literal into fixtures.generated.ts by JSON.stringify)"
      - code: "scripts/contract/check.mjs:296-309 and packages/mission-ui/src/contract/bulk.ts:1-3 (bulk pages are validated in checkBulk and are NOT registry fixtures; the registered pageLong holds 40 items and is stored)"
    claim: >-
      A name in the registry is stored: a 1000-entry listing and a 256 KiB document would add hundreds of KiB to
      fixtures.generated.ts and be byte-compared by C3. The plan wants the opposite, but its mechanism (registered
      fixtures) cannot do it, and it names no change to checkBulk, which is the only place generated documents are
      validated against the contract today. As written, the large documents are either stored (contradicting FR-044
      and the plan) or never validated by the contract gate.
    remediation: >-
      Split the inventory: (1) registered, stored fixtures; (2) bulk generators in bulk.ts (makeArtifactListing(n),
      makeLargeMarkdown(bytes), makeLongLine(bytes), makeOverBudgetMarkdown()) validated in checkBulk (state the
      schema each is validated against and extend checkBulk in IC-01), imported by element fixtures.ts builders.
      Keep the 40-entry style stored fixtures only for small cases.

  - id: PLAN-CORRECT-017
    lens: spec-fidelity
    severity: 3
