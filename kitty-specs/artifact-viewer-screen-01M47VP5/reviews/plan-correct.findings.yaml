    evidence:
      - artifact: "spec.md Edge Cases ('Listing present but content and contentStatus absent: nothing-selected if selectedPath is empty, else the content-loading state')"
      - artifact: "data-model.md Screen properties (contentStatus default 'ready', content default null) and § ArtifactView rules; contracts/sk-artifact-screen.md § Rendering (contentStatus 'ready': toolbar, tabs and the body per resolveArtifactView)"
    claim: >-
      The default contentStatus is 'ready' and the default content is null, so the exact situation the spec calls
      out (host sets a listing and a selectedPath and has not yet passed content) arrives as ready-with-null-content.
      The resolver rules list panes (nothing-selected, loading, refusal, error, empty-file, document) but never say
      that ready with content null maps to loading, nor what 'refused' with refusalCode null or 'error' with an empty
      errorMessage shows. IC-02's unit tests would have to invent these cases.
    remediation: >-
