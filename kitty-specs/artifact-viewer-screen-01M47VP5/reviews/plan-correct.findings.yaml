  - id: PLAN-CORRECT-023
    lens: internal-consistency-and-feasibility
    severity: 2
    title: "D-11 reads the seven refusal codes from example files although the contract has an authoritative enum schema"
    evidence:
      - artifact: "research.md D-11 and contracts/gates.md ('the seven codes from the code: fields of examples/ArtifactRefusal.*.yaml; a guard asserts exactly 7 files and 7 codes')"
      - code: "contract (spec-kitty main 2261ad5) schemas/ArtifactRefusalCode.yaml (enum of the seven codes); examples/ArtifactRefusal.*.yaml are examples, one per code today"
      - code: "eslint.data-driven.config.mjs:24-28 (existing words are read from schemas: MissionPhase.yaml, StatusLane.yaml)"
    claim: >-
      The existing gate reads vocabulary from schema enums. Reading refusal codes from the example files ties the gate
