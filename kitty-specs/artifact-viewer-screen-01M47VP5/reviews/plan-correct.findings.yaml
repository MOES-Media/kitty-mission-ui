  - id: PLAN-CORRECT-020
    lens: spec-fidelity
    severity: 2
    title: "Layout table conflates the prototype's 620 px breakpoint with the shell's mobile tier (the shell is mobile below 720 px)"
    evidence:
      - artifact: "plan.md § Architecture layout table, third row ('below the shell's mobile tier width (about 620 px viewport; the cell width is measured by S-A6)') and contracts/sk-artifact-screen.md § Layout"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:33-34 (EXPANDED_QUERY min-width 1100px, COLLAPSED_QUERY min-width 720px) and :352-354 (mobile tier padding)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:150-168 (mobile tier: single column, no rail, so the content cell equals the viewport)"
    claim: >-
      The shell's mobile tier starts below 720 px, not 620 px; 620 px is the prototype's own toolbar and table
      breakpoint, which lies inside the mobile tier. In the mobile tier the cell width equals the viewport, while at
      720 to 732 px (collapsed tier, viewport minus 112) the cell is 608 to 620 px, so cell width is not monotonic in
      viewport width across the 720 px edge. A container threshold 'max-width: 620px' therefore stacks the toolbar at
      720 to 732 px where the prototype does not. The text also gives no number for this row, although FR-036 asks for
      thresholds 'derived at plan'.
    remediation: >-
      Correct the row to 'viewport 620 px (mobile tier, cell = viewport)', record in S-A6's brief that cell widths must
      be measured per tier (mobile, collapsed, expanded) and that the toolbar-stack threshold has to be chosen with the
      720 px edge in mind (or derived from tier-independent content measure), and state the provisional figure like the
      other two rows.

