schema: review-findings/v1
complete: true
phase: plan
lens_group: a11y
mission: artifact-viewer-screen-01M47VP5
profile_applied: designer-dagmar (audit mode; accessibility, design-system consistency, fully specified for implementers; directive 031)
findings:
  - id: PLAN-A11Y-001
    lens: visual-fidelity / container thresholds (A-1, DA-33, S-A6)
    severity: 4
    title: "The 689 px two-column container threshold flips back to two columns in the shell's mobile tier (viewports 689 to 719 px), and S-A6 does not sample there"
    evidence:
      - artifact: "plan.md:93-99 (table: min-width 689 two columns; max-width 688 one column; third row 'below the shell's mobile tier width (about 620 px viewport)')"
      - artifact: "contracts/sk-artifact-screen.md:39 (thresholds 688/689 'from the prototype's 800 px viewport on the collapsed shell tier (viewport minus 112)')"
      - artifact: "research.md:122 (S-A6 measures at 1280, 1100, 800, 620 px only)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:33-34 (EXPANDED_QUERY min-width 1100px, COLLAPSED_QUERY min-width 720px)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:156-169 (mission layout: expanded = rail + 240px sidebar + 1fr, collapsed = rail + rail + 1fr; mobile tier has no extra column, so the content cell equals the viewport)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:455-465 (readTier: below 720 is 'mobile')"
      - artifact: "prototype screens-opendesign-v2/prototype.css:922-929 (reading-layout one column at max-width 800px viewport) and :947-948 (toolbar stack and table block at max-width 620px)"
    claim: |
      The tier arithmetic in the plan is right for the two wide tiers (verified: expanded cell = viewport - 296 = rail 56 + sidebar 240; collapsed cell = viewport - 112 = rail 56 + icon column 56; both from the shell grid and the prototype layout tokens). It is wrong for the third. Below 720 px the shell is in its mobile tier and the content cell is the full viewport width, not viewport minus 112. The cell width therefore is not monotonic in the viewport: 1099 px gives 987, 1100 gives 804, 800 gives 688, 720 gives 608, 719 gives 719. A single container rule "two columns from 689 px" then produces, for viewports 689 to 719 px, two columns with a 419 px document next to a 270 px inspector, then one column again from 720 to 800 px, then two columns again from 801 px. The prototype is one column for every viewport of 800 px or less. The same asymmetry hits the toolbar stack: prototype stacks at viewport <= 620; a container rule "cell <= 620" also fires at viewports 720 to 732 (collapsed tier, cell 608 to 620) where the prototype does not stack. Plan row 3 calls 620 px "the shell's mobile tier width", but the shell's mobile tier starts below 720 px; 620 is the prototype's own breakpoint. The IC-06 layout test cases (1280, 1100, 800, 620) and the AV stories never visit 689 to 719 or 720 to 732, so the defect would pass every gate and the drift would be a REJECT only if a reviewer happened to look.
    remediation: |
      FORK: choose how the container thresholds map to the prototype's viewport behaviour.
      (a) Raise the two-column minimum so it cannot be reached in the mobile tier and stays monotonic across the collapsed tier: for example two columns from a cell of 720 px (viewport 832 on the collapsed tier, 720 to 799 never two columns on mobile because the cell is < 720 only up to 719). Record the 801 to 831 px window as confirmed drift in DA-33 at CP-1. Likewise pick the toolbar-stack threshold so it also holds in both tiers, or accept and record the 720 to 732 window.
      (b) Keep 688/689 as is and record, as DA-33 drift, that the viewport window 689 to 719 shows two columns; not recommended (a 419 px document column).
      (c) Amend FR-036 to allow one narrow viewport media query (800 px) for the column switch, which reproduces the prototype exactly; this contradicts the spec's "not viewport media queries" and needs the operator.
      In all cases: extend S-A6 to sample 689, 719, 720, 732, 799, 800, 801, 831, 832, 1099 and 1100 px in both shell tiers and write the cell width at each into contracts/sk-artifact-screen.md; add layout cases at 719 and 720 px to IC-06 and fix plan.md:97 so "mobile tier" means below 720 px.

  - id: PLAN-A11Y-002
    lens: focus management / skip target
    severity: 3
    title: "The contract makes the document pane the skip-link target, but the shell's skip link focuses its own wrapper and an id inside the screen's shadow root cannot be reached"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:11 ('the document pane is the skip target (id and tabindex=-1 on the pane)')"
      - artifact: "contracts/sk-artifact-screen.md:62 (behaviour rule 8: focus moves to the document pane, 'the skip target')"
      - artifact: "spec.md:344 (C-010: skip link text comes from the shell's skip-link slot)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/shell-parts.ts:236-245 (skip link is an sk-button href='#content'; main holds <div data-focus-target tabindex='-1'><slot>)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/sk-mission-shell.ts:520-530 (onSkipLink preventDefault then focuses [data-focus-target]; comment: a fragment link cannot reach an id inside a shadow root, G-10)"
    claim: |
      The skip link ("Skip to artifact") lands on the shell's [data-focus-target] wrapper, never on an element inside sk-artifact-screen, and the screen's id is in a separate shadow root so the fragment cannot find it either. The contract's claim that the pane "is the skip target" is false for the shipped shell, and FR-037 forbids changing the shell. Consequence: after the skip link a keyboard user is on the wrapper, the next Tab goes to the first control inside the screen (tab 1), which is correct enough, but the screen-reader announcement and the "focus order: tree, tabs, document, inspector" in the same file do not account for the skip target; AV-32's tab-<n> counts will be off by the wrapper. Rule 8 (refocus when the focused control disappears) is a separate focus move that needs its own target, which the contract conflates with the skip target. The IC-06 and IC-10 test lists name no test for rule 8 at all.
    remediation: |
      Delete the "skip target" wording; state that the skip link focuses the shell's wrapper and the screen takes no part. Give rule 8 its own named target (the pane element with tabindex=-1 and no id) and its own tests in IC-06 (the pane is focusable) and IC-08 or IC-10 (Retry activated, link activated that swaps content, tree-driven content swap: focus lands on the pane, never on body; a positive control where focus is elsewhere and is left alone). Ensure the pane's focus ring on programmatic focus is decided (see PLAN-A11Y-011).

  - id: PLAN-A11Y-003
    lens: tab stops (NFR-003) / focusable scroll regions
    severity: 3
    title: "Every table scroll box and both tabpanels are unconditionally focusable, which inflates tab stops, and the contract contradicts itself about when the document is a stop"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (rendered article and raw block both tabindex='0'; table scroll box role=region tabindex=0)"
      - artifact: "contracts/sk-artifact-screen.md:66 (focus order: 'the document pane (when scrollable), links and table scroll boxes in document order')"
      - artifact: "spec.md:316 NFR-003 ('in no more tab stops than controls shown; a scrolling region counts as a control')"
      - artifact: "research.md:119 (S-A3 tests the look of the scroll box, not whether it should be a stop)"
      - artifact: "spec.md:390 DA-23 (both rendered and raw focusable)"
    claim: |
      NFR-003 is satisfied only by definition: a scrolling region "counts as a control", so a document with twelve tables yields twelve extra tab stops even when no table overflows, plus the tabpanel stop that already contains focusable links. The contract line 47 says unconditional tabindex=0; line 66 says "when scrollable". Both cannot hold, and nothing says how "scrollable" is decided (a ResizeObserver or scrollWidth check at render, which is not specified or tested). Unconditional stops make keyboard traversal of a long spec.md tedious and the test "tab stops equal controls shown" vacuous. Also the real scroller in the prototype is the .document-pane (prototype.css:846 overflow auto), while the plan puts tabindex on the tabpanel inside it and tabindex=-1 on the pane; which element a keyboard scroll acts on is not tested.
    remediation: |
      FORK: (a) Make focusability conditional on overflow: a table box and the tabpanel get tabindex=0 only while scrollWidth/scrollHeight exceeds the client size (recomputed on ResizeObserver; no timers), and AV tests assert both states with a positive control; (b) keep unconditional focusability for the raw block and rendered article (one stop each, like the prototype raw view, prototype 05-artifact.html:53) but make table boxes conditional; (c) keep everything unconditional and amend NFR-003 and the focus-order text to say so, accepting the stop count. Either way, fix the contradiction at contracts/sk-artifact-screen.md:47 vs :66, name the actual scrolling element, and add a test that scrolls the tabpanel by keyboard (PageDown) and moves the scrollTop.

  - id: PLAN-A11Y-004
    lens: renderer allowlist vs semantics (cross-contract contradiction)
    severity: 3
    title: "Table scroll box is named from the first header cell text, but the renderer contract forbids any document-derived aria-* value"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (table scroll box 'named \"Table\" with the header text of its first cell where present')"
      - artifact: "contracts/markdown-renderer.md (attributes section: 'A value from the document reaches only title ... No class, style, id, name, href ... or document-derived data-* or aria-* value exists')"
      - artifact: "contracts/markdown-renderer.md (no id allowed, so aria-labelledby cannot reference the header cell)"
      - artifact: "plan.md:62 and research.md D-06 (only keyword, digits and truncated title values may come from the document)"
    claim: |
      The semantics section requires an accessible name that contains document text; the security contract, which is the gate (corpus step 2 and 3 walks every attribute), forbids exactly that and also forbids ids, so aria-labelledby is unavailable. An implementer will either break the allowlist or drop the name. Separately, a name built from the first header cell repeats nothing useful when several tables share the same first header ("Table Name" five times).
    remediation: |
      FORK: (a) static, data-held name with a position count from the model, for example "Table 2 of 5" (no document text; words from defaults/ or labels); (b) amend the allowlist to permit aria-label whose value is a Lit text-bound, length-truncated string from the first header cell, add it to the corpus (an entry with a hostile header cell) and to the attribute list in the contract. Recommend (a). Update both contracts and add the case to the corpus.

  - id: PLAN-A11Y-005
    lens: headings and landmarks
    severity: 3
    title: "The page has no h1 for raw-only files, refused files, the empty file and any markdown without a leading heading, and refusal and inspector heading levels are unspecified"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (file name is NOT a heading; the document's own first # is its h1)"
      - artifact: "spec.md:269 FR-006 ('levels kept'), spec.md:381 DA-14, spec.md:391 DA-24 (refusal title 'Artifact unavailable')"
      - artifact: "prototype 05-artifact.html:62 (refusal title is an h1) and :67 (inspector section heading is an h3)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/shell-parts.ts:245 (shell main holds no heading; no h1 in the shell parts)"
    claim: |
      With the toolbar name demoted to a strong and heading levels kept as authored, a JSON or YAML file (Q5 raw-only), an empty file, a document that starts at ## or has no heading, and every state block other than the refusal have no h1 and no heading at all in the main landmark; a spec.md with two # headings has two h1. The prototype gives the refusal an h1 and the inspector an h3 ("Linked Work Packages"); the plan names neither level for the refusal title, the not-found, nothing-selected and empty states, nor for the inspector groups (File, Mission, Linked Work Packages), so implementers will pick levels at random and the h3 would follow an h1 or nothing. Screen-reader users navigating by heading get an unstructured page in exactly the cases where the raw tab is the only content.
    remediation: |
      FORK: (a) make the toolbar file name the page's single h1 (visually the same strong, one element change) and demote authored headings by one level in the renderer (h1 to h2 ... capped at h6), which keeps structure valid in every state but departs from "levels kept" (FR-006) and needs an amendment; (b) keep authored levels and give raw-only, empty and state panes a visually-hidden h1 carrying the file name, accepting duplicate or missing h1 inside documents; (c) keep as written and record the gap in the PR. Whichever is chosen: specify the heading level of the refusal and state titles (prototype uses h1), give inspector group headings a fixed level below the document's, and add a semantics test that lists the heading outline for six fixtures (markdown, json, empty, refused, not-found, hostile).

  - id: PLAN-A11Y-006
    lens: inline link control (D-14), nested interactive content
    severity: 3
    title: "A link whose content is an image creates a role=link nested inside a role=link, and the corpus and the contract do not cover it"
    evidence:
      - artifact: "research.md:63 D-08 (an image whose destination is external is 'the same inert-or-external link control around the whole text')"
      - artifact: "contracts/markdown-renderer.md (Images paragraph; links are <a role=link tabindex=0>; image placeholder is the external link control)"
      - artifact: "contracts/markdown-renderer.md (corpus list includes link inside table cell, heading, emphasis, adjacent links; no image-in-link entry)"
      - artifact: "spec.md:194 (edge case lists link in a table cell or heading, not an image in a link)"
    claim: |
      The very common badge idiom [![build](https://host/badge.svg)](https://host/ci) parses to a link containing an image. The renderer would emit an outer external link control and, because the inner image has an external source, an inner link control inside it: two nested tab stops and nested role=link with different handlers and events (sk-open-link twice, with two different hrefs). Nothing in the contract says which wins, and the corpus does not contain the case, so the "exactly one expected event" assertion (step 5) is never exercised against it.
    remediation: |
      Add a rule to the renderer contract: an image inside a link renders as plain placeholder text (the outer link's text), never as its own control; an image link is only a control when the image is not inside a link. Add corpus entries for [![a](http://x)](http://y), [![a](x.md)](y.md) and an image inside an inert link, asserting one control, one tab stop, one event and the visible text.

  - id: PLAN-A11Y-007
    lens: inline link control (D-14), name, suffix, inert links
    severity: 2
    title: "D-14 says the link name equals the link text and also carries a hidden suffix, and inert links get no state text although NFR-011 asks for one"
    evidence:
      - artifact: "research.md:81 D-14 ('name equal to the link text, a visually hidden suffix ... so the state is not colour-only'; inert links are span with title)"
      - artifact: "contracts/markdown-renderer.md (rendering paragraph: inert link is <span title=...>; the hidden suffix is described for external and artifact links only)"
      - artifact: "spec.md:325 NFR-011 (statuses carry a text form), spec.md:42 N-Q12 (destination of an inert link in title)"
    claim: |
      A hidden suffix makes the accessible name "text opens another artifact", which is not "equal to the link text"; with several links in a paragraph the repeated suffix is noisy and, for two links with the same text, the suffix is the only difference. The renderer contract and D-14 disagree about whether inert text gets a suffix ("not a followable link" is listed in D-14, absent in the contract). The destination is exposed only in title, which keyboard-only and touch users and many screen readers never get; an inert link also has no visible difference from plain text unless E-22 defines one, and none is specified.
    remediation: |
      State the intended name pattern ("<text>" with the kind in aria-description or a described-by hidden span rather than inside the name, or the suffix kept in the name and the "equal" wording dropped), apply one rule to the three link results, and define the visible inert style in E-22 (for example no underline, normal body colour, so followable links are distinguishable by more than colour: underline already planned). Add one test that dumps the accessible name and description of an internal, external and inert link in the same paragraph.

  - id: PLAN-A11Y-008
    lens: tablist and tabpanel naming
    severity: 3
    title: "Raw-only, empty-file and fallback views have no defined tablist state, yet the panels are declared role=tabpanel labelled by a tab"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (the rendered article and the raw block are role=tabpanel with aria-labelledby the tab)"
      - artifact: "spec.md:274 FR-011 and spec.md:379 DA-12 (non-markdown: no tablist; the toolbar keeps the file name and the pane is the raw block)"
      - artifact: "data-model.md (ArtifactView.tabs: 'two' | 'none', body: rendered | fallback | raw)"
      - artifact: "prototype 05-artifact.html:41 (fallback panel is a tabpanel labelled by the Rendered tab, which is relabelled Fallback)"
    claim: |
      When tabs is 'none' there is no tab to be the labelledby target, so the raw block either carries a dangling aria-labelledby (axe aria-valid-attr-value) or no name, and a tabpanel without a tablist is itself a misuse. The contract does not say what the raw-only block's role and name are. The fallback case relies on the relabelled first tab; the name of the fallback panel and the "Fallback" text for assistive tech (the tab is selected but the panel also contains the attention notice) are not specified. The same goes for an empty file in the rendered tab.
    remediation: |
      Specify per ArtifactView.tabs: for 'two', panels are tabpanel labelled by their tab; for 'none', the raw block is a role=region (or the plain pre with an aria-label from defaults/, "File source") with tabindex per PLAN-A11Y-003, and no aria-controls or aria-labelledby. Add the three cases to the semantics test, including a check that no aria-labelledby or aria-controls idref is dangling (shadow-root-local ids).

  - id: PLAN-A11Y-009
    lens: focus order vs visual order
    severity: 3
    title: "In the one-column layout the inspector is moved first visually (order: -1) while DOM and documented focus order keep it last"
    evidence:
      - artifact: "plan.md:96 (one column, inspector first via order: -1)"
      - artifact: "contracts/sk-artifact-screen.md:66 (documented focus order: tree, tab 1, tab 2, document, links and table boxes, then the inspector controls)"
      - artifact: "prototype.css:929 (.reading-layout > .inspector { order: -1 }); prototype 05-artifact.html:64 (aside after the document pane in DOM)"
      - artifact: "spec.md:232 AV-32 (focus order tested at 1280 only)"
    claim: |
      Below the switch the inspector (with its Work Package controls and Open Work Package button) is drawn above the toolbar and document, but Tab and reading order still visit the document first and the inspector last. This is the prototype's behaviour (so it is not a fidelity defect) but it is a WCAG 1.3.2 / 2.4.3 mismatch the plan promises to document and does not test: AV-32 is a single 1280 px story, and the tablist at 800 px and 620 px is reached after content that appears below it visually. In the narrow tiers the focus ring would jump from the tree to the middle of the page, then back up to the inspector at the end.
    remediation: |
      FORK: (a) keep the prototype's visual order and record the mismatch as a confirmed DA-33 sub-item with a test that documents the real tab order at 800 and 620 px; (b) place the inspector before the document in DOM order and use grid-column placement to keep it on the right in two columns (visual order of the wide layout unchanged, reading and focus order always match the one-column visual order); (c) in the one-column layout drop order: -1 and keep the inspector after the document (prototype drift, needs CP-1 confirmation). Recommend (b) or record (a) explicitly.

  - id: PLAN-A11Y-010
    lens: reduced motion, forced colours, text-only state (NFR-004, NFR-011)
    severity: 3
    title: "No plan home for the prototype's forced-colors and prefers-reduced-motion rules, and the selected tab is shown by background colour only"
    evidence:
      - artifact: "prototype.css:951-957 (@media prefers-reduced-motion and @media forced-colors: active, focus-visible outline Highlight, current items bordered)"
      - artifact: "prototype.css:755 (.segment[aria-selected=true] differs from the unselected tab only by background and colour)"
      - artifact: "gates.md E-25 (tab look: token border, border-radius, background, color, padding), spec.md:325 NFR-011 (list of statuses: kind, refused cause, redaction, unavailable, fallback)"
      - artifact: "grep of plan.md, spec.md, research.md and contracts/*.md for 'forced', 'reduced', 'prefers-' finds none"
    claim: |
      The prototype carries both media features; the plan mentions neither, and no story, test or exception covers them. The selected tab (a state) is not in NFR-011's list and, with only a background tint distinguishing it (E-25 allows no border or underline marker), it disappears in forced-colors mode, where backgrounds are overridden and aria-selected has no visual effect. Table cell borders and the notice border survive, but the unavailable (dashed) and focus outlines depend on library tokens whose forced-colors behaviour is not checked. The busy indicator (adopted progress family) animates; reduced-motion behaviour is unspecified for this screen.
    remediation: |
      Add: (1) NFR-004 sibling, "forced-colors and reduced-motion": a Playwright context with forcedColors: 'active' and reducedMotion: 'reduce' and an assertion that the selected tab, the focus ring and the table box are distinguishable (selected tab gets a border or underline from a token, which E-25 must list, plus a forced-colors outline fallback), and that no animation runs on the screen's own elements; (2) add "selected tab" and "current tree row" to NFR-011's list of non-colour-only states; (3) one uncommitted forced-colors screenshot per region WP as evidence (no extra baseline needed).

  - id: PLAN-A11Y-011
    lens: focus ring coverage and visual evidence
    severity: 3
    title: "Focus-ring styling is granted to E-23, E-24, E-25 but not to E-22 (links, rendered article, pane), and one AV-32 story cannot evidence ring appearance for any of them"
    evidence:
      - artifact: "contracts/gates.md E-22 (allowed properties list has no outline-*; links use text-decoration and cursor only)"
      - artifact: "contracts/gates.md E-23, E-24, E-25 (each lists token outline-width/outline-offset/outline-color, 'E-16's pattern')"
      - artifact: "contracts/sk-artifact-screen.md:75 (AV-32 is one story; AV-31 focuses the active tab only) and contracts/sk-artifact-screen.md:47 (rendered article and pane focusable)"
      - artifact: "prototype.css:700 (global :focus-visible token outline, shadow-DOM-local rules cannot inherit it)"
    claim: |
      The rendered article (a tabpanel, tabindex 0), the inline links (tabindex 0) and the pane (tabindex -1 target of rule 8) live in prose-styles.ts under E-22, which has no outline properties, so inside the screen's shadow root they get the browser default ring (not the prototype's yellow token ring) or none if a reset removes it. Only the tab (AV-31) and one other stop (AV-32) will have an approved baseline; the focus rings of a table scroll box, the raw block, an inline link and the rendered article are visual claims (FR-035 "visible focus ring", NFR-008) with no story. A reviewer cannot reject on drift with nothing to compare.
    remediation: |
      Add the E-16 ring properties to E-22 for [data-md=link], the article and the pane (or state that the pane ring is suppressed for programmatic focus only via :focus-visible, which stays default), and extend the story catalogue with focus variants for a link, a table box and the raw block (can be tag-driven variants of AV-03 and AV-02 with tab-<n>, three more baselines, or put several focus moments into AV-32 by splitting it 32a-d). Update the 42 count and the row-to-story test accordingly.

  - id: PLAN-A11Y-012
    lens: visual fidelity (DA-3 icons), prototype elements with no plan home
    severity: 3
    title: "Per-kind icons collapse to one glyph without a spec amendment, which makes AV-15 'kind icons' and AV-29 'neutral icon vs kind icon' unevidenceable, and the toolbar icon has no named element"
    evidence:
      - artifact: "plan.md:248 ('DA-3 per-kind icons collapse to one document icon ... not amendments')"
      - artifact: "research.md:108 G-17 ('one file glyph for every kind')"
      - artifact: "spec.md:217 AV-15 ('kind icons'), spec.md:231 AV-29 ('neutral icon and the raw word'), spec.md:266 FR-003 ('a file icon (by kind)'), spec.md:370 DA-3"
      - code: "ShellIcon closed set per research.md:20 (missions, drift, ops, projects, pipeline, work-packages, artifacts, file, folder, menu, close, back)"
      - artifact: "prototype 05-artifact.html:34 (toolbar icon is an inline svg); contracts/sk-artifact-screen.md:47 ('file icon (decorative)', no element or exception named)"
    claim: |
      If every kind maps to the same 'file' glyph the neutral icon for an unknown kind is identical to the known-kind icon, so the pass conditions of AV-15 and AV-29 and the "kind icon" in FR-003 are untestable, and the kind word becomes the only differentiator. This is a change to a spec row, a drift register item (DA-3 was "confirm kind-driven") and an FR, yet the plan files it as "noted, not an amendment", so the operator is not asked to rule on it at CP-1's amendments list. The toolbar's file icon (not a tree icon) has no stated source: the closed shell icon set belongs to the shell tree; an inline svg is a hand-rolled primitive with no exception, and the library element for icons is not named.
    remediation: |
      Promote to amendment A-5 (FR-003, AV-15, AV-29, DA-3: one glyph for all kinds in v1, G-17; AV-29's pass condition becomes "the raw kind word is shown"); name the toolbar icon source (the library icon element or a shell icon if available) or add it to E-22/E-26 scope; keep the per-kind table in defaults/ (icon field) so the later glyphs are data.

  - id: PLAN-A11Y-013
    lens: visual fidelity (prototype elements with no home)
    severity: 2
    title: "The prototype's raw-view 900 px measure and the toolbar's 68 px minimum height are neither kept nor dropped"
    evidence:
      - artifact: "prototype.css:855 (.raw-view width min(900px, 100%)) and :847 (.document-toolbar min-height 68px)"
      - artifact: "spec.md:389 DA-22 (mentions '900 px max' only as prototype wording), contracts/gates.md E-24 allowed list (no width, max-width or min-height)"
      - artifact: "no DA item and no exception for the toolbar min-height (grep 68px: none in the mission artifacts)"
    claim: |
      The register changes how the raw block wraps (DA-22) but is silent on its width measure; E-24 does not allow width or max-width, and Stylelint would reject a px literal. The toolbar's 68 px band height is a visible dimension of the prototype with no plan home either (the page-header precedent in #4 needed an exception for a similar length). Either becomes an unlogged drift at baseline review.
    remediation: |
      Add both to the register as confirmed items at CP-1: raw block max-width (allow max-width: 900px, or a token, in E-24) and toolbar min-height (use a token or a numbered exception, or drop it and record the drift). S-A2 and S-A4 should include the two numbers in their prototype side-by-sides.

  - id: PLAN-A11Y-014
    lens: live regions
    severity: 2
    title: "The single polite live region has no stated lifecycle, and tests assert copy rather than announcement"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:43 (live-region drawn by the screen) and :49-51 (announcement rows; 'One test per row')"
      - artifact: "plan.md:221 (IC-08 'the live-region announcements')"
      - artifact: "spec.md:298 FR-035 (one polite live region announces loading, ready, refused and error changes)"
    claim: |
      Nothing says the region persists across status changes (a region inserted with its text is often not announced), that initial mount does not announce "ready", that the sk-progress busy indicator (which may carry its own role) does not duplicate "Loading", or that rapid selection changes coalesce. Tests per row can only prove the text exists. A tree selection announcing "<name> loaded" on every change is acceptable, but a refusal announced as "<name> unavailable: <cause>" duplicates the visible refusal block heading when focus also moves there (PLAN-A11Y-002).
    remediation: |
      State in the contract: the live region element is always rendered, its text replaced (never recreated), no announcement for the first render of a ready state, busy look has aria-busy and no second announcement. Test with a MutationObserver on the region (one text change per transition) rather than a text lookup, and a test that a rapid A-to-B selection announces once.

  - id: PLAN-A11Y-015
    lens: 200% text, reflow (NFR-004)
    severity: 2
    title: "Container thresholds and the 270 px track are in px while text scales, and NFR-004 only checks for horizontal overflow"
    evidence:
      - artifact: "spec.md:318 NFR-004 (root font size 200% at 1100 and 720 px, no horizontal overflow)"
      - artifact: "contracts/gates.md E-27 (inspector track pinned to 270px; container query lengths need no entry)"
      - artifact: "plan.md:95 (two columns from 689 px)"
      - artifact: "prototype.css:845 (270px track), :848 (.prose padding in space tokens)"
    claim: |
      At a 200% root size the padding tokens (rem) double but the 270 px inspector and the 689 px container threshold do not, so at 1100 px (cell 804) the document column is about 534 px minus 2 x 48 px padding, roughly 438 px of 32 px text, about 25 characters per line, and the two-column layout is kept where the prototype's own 200% zoom (a halved viewport in CSS px) would have switched to one column. The test passes (no overflow) but the intent of 1.4.4 and 1.4.10 (readable reflow) is not met, and no story exercises 320 px or 400%.
    remediation: |
      Express the container thresholds in rem (container queries accept rem) so the switch follows text size, and state the inspector track in rem or as a clamp with a token if S-A6 allows (E-27 pins a single length either way). Extend NFR-004's test to assert the resolved track count at 200% (expected one column at 1100 px) and add one 320 px, 400% reflow check (tables allowed to scroll, no page horizontal scroll).

  - id: PLAN-A11Y-016
    lens: landmarks
    severity: 2
    title: "Landmark structure: two regions with the same name, an aside nested in main, and regions nested inside a region"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (toolbar in a labelled region named by the file name; the pane role=region named by the file name; the inspector is an aside; each table box is a region)"
      - code: "packages/mission-ui/src/elements/sk-mission-shell/shell-parts.ts:245 (everything sits in the shell's main)"
      - artifact: "prototype 05-artifact.html:33-34, :64 (section.document-pane unnamed; aside labelled; the toolbar is a header, not a region)"
    claim: |
      Two regions share one accessible name (toolbar region and pane), a region contains regions (pane > each table), and the aside is a complementary landmark inside main, which axe flags as not top-level (landmark-complementary-is-top-level) and which the prototype also does. Landmark lists will show "spec.md, spec.md, Table, Table, Artifact metadata", which is noise and a likely axe finding in IC-10.
    remediation: |
      Drop the toolbar's region role (keep a plain div/header); name the pane by a distinct word ("Document: <name>") or leave it unnamed without role=region; keep table boxes as regions only when they are stops (PLAN-A11Y-003); use a div with an aria-label group or accept and suppress the aside rule with a recorded rationale in the IC-10 test. Run axe in S-A4 and S-A5 so the result is known before IC-06 freezes the parts.

  - id: PLAN-A11Y-017
    lens: story catalogue and baseline plan
    severity: 2
    title: "Tier stories (AV-33 to AV-35) are owned by the last chain, AV-33 is mislabelled the collapsed tier, and no baseline shows the collapsed tier with two columns"
    evidence:
      - artifact: "plan.md:227 (IC-10: AV-32 to AV-35 'focus order and ring, collapsed, narrow, mobile')"
      - artifact: "plan.md:243 A-1 (AV-33 two columns at a 1100 px viewport 'the shell's expanded tier edge')"
      - code: "sk-mission-shell.ts:33 (expanded from min-width 1100px, so a 1100 px viewport is the expanded tier)"
      - artifact: "plan.md:213 (IC-06 tests track counts at 1280, 1100, 800, 620 px only; layout owned by IC-06, tier stories by IC-10)"
      - artifact: "plan.md:229 (IC-11 is the only baseline commit; baselines respect 'last WP')"
    claim: |
      Baselines-only-in-IC-11 is respected. But the layout is built in IC-06 and its three visual rows only get a story in IC-10, after the document, state and inspector parts exist: a threshold or stacking error is first seen after four WPs build on it. A-1's own text moves AV-33 to the expanded tier, yet IC-10 and the row title still call it "collapsed", and no story is at a collapsed-tier viewport with two columns (for example 1000 px, cell 888) or in the 689 to 719 window of PLAN-A11Y-001. The 800 px story is the only collapsed-tier baseline.
    remediation: |
      Rename the rows (AV-33 expanded edge, AV-34 collapsed and one column) and add a collapsed two-column story or use 1000 px in the tier test; require IC-06 to hand over an uncommitted side-by-side per tier (1280, 1100, 1000, 800, 720, 620) with stub parts so the layout drift is caught before chain X and Y start.

  - id: PLAN-A11Y-018
    lens: Work Package control and pills (element with no plan home)
    severity: 3
    title: "The interactive 'linked Work Package pill' has no named element and no exception, and sk-pill-tag is not a control"
    evidence:
      - artifact: "contracts/sk-artifact-screen.md:47 (linked Work Packages 'a ul of controls, each named by the Work Package title and id')"
      - artifact: "spec.md:290 FR-027 ('each pill ... emits sk-select-work-package'), spec.md:396 DA-29"
      - artifact: "plan.md:13 (primary elements: sk-pill-tag, sk-notice, sk-button), gates.md E-26 and E-25 (no entry for a raw button or link inside the inspector)"
      - artifact: "prototype 05-artifact.html:67 (each linked Work Package is an a.badge link)"
    claim: |
      A pill that emits an event must be a focusable control. The plan names no element for it: sk-pill-tag is a status/label primitive (its interactivity is not shown anywhere in the planning artifacts and S-A4 does not test it), a raw <button> is banned (ESLint) and no exception grants one in inspector-parts.ts, and sk-button is not a pill. Pill ellipsis, "shared rule" and the accessible name are specified but not which element carries the click, the Enter/Space handling or the focus ring.
    remediation: |
      Add to S-A4 the question "which library control renders a clickable Work Package pill" with outcomes: (a) sk-pill-tag if interactive, (b) sk-button variant secondary (small) as the control with the pill look dropped as DA-29 drift, (c) a numbered exception (E-28) for a raw button in inspector-parts.ts only with leak plant. Decide at CP-1 beside D-13.

  - id: PLAN-A11Y-019
    lens: spike sufficiency (S-A5, S-A3)
    severity: 2
    title: "S-A5 and S-A3 do not test the engines, modes and cases that decide the tab and link controls"
    evidence:
      - artifact: "research.md:121 (S-A5: variants (a) and (b), axe and the accessibility tree dump, link Enter/Space/Tab)"
      - artifact: "research.md:119 (S-A3: scroll box look and scrolling at 688 and 620)"
      - artifact: "plan.md:206 (spike evidence is uncommitted screenshots; no screen-reader step)"
    claim: |
      The decision between sk-button role=tab and a raw role=tab button, and the choice of <a role=link tabindex=0>, rests on a Chromium tree dump. The shadow-root idref scoping for aria-controls and aria-labelledby (a risk specifically for variant (a), where the tab is a library element in another shadow root), Safari/WebKit and Firefox exposure of an href-less a with role=link, forced-colors rendering and the nested-image link (PLAN-A11Y-006) are not in the spike list.
    remediation: |
      Add to S-A5: idref resolution across shadow roots for variant (a); the same tree dump in WebKit and Firefox (Playwright supports both); a forced-colors screenshot of each variant; the image-in-link case; and a note that a real screen-reader pass (VoiceOver and NVDA) is the operator's CP-1 review, not a plan-time claim.

  - id: PLAN-A11Y-020
    lens: touch target sizes
    severity: 1
    title: "Touch and pointer target sizes are not stated anywhere in the plan"
    evidence:
      - artifact: "prototype.css:753 (.segment min-height 36px) and :731 (tree rows and nav items min-height 44px)"
      - artifact: "grep for '44px', 'target size', 'touch' in the mission artifacts: none"
    claim: |
      The tab controls (prototype 36 px) and the pills are below the 44 px the prototype uses for tree rows; WCAG 2.5.8 (24 px) is met, but an implementer building the tab control with a token-only exception (E-25) has no target to hit and may produce a smaller control than the prototype. Inline links are exempt.
    remediation: |
      State in E-25 and the pill decision that the control's block size is at least the prototype's 36 px (tab) and 24 px (pill), measured in the S-A5 and S-A4 spikes, and add one bounding-box assertion to the IC-10 accessibility tests.
