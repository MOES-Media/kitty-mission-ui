- id: n-003
  category: tooling
  summary: Full test, gate-proof and browser runs exhausted memory and systemd-oomd killed every agent session
  evidence_refs:
  - e-014
  details: 'Running the full pnpm test, the gate-proof legs and the browser runs on one machine exhausted memory, and systemd-oomd
    killed every agent session, not only the heavy run. The fix was the heavy wrapper: a memory-capped cgroup plus a machine-wide
    lock so that only one heavy run goes at a time. Heavy proofs are now left to CI.'
- id: n-004
  category: tooling
  summary: spec-kitty consolidate refused the squash strategy and rolled back
  evidence_refs:
  - e-001
  details: spec-kitty consolidate refused with "SQUASH reconciliation refused..." and rolled back. Re-running with --strategy
    merge worked.
- id: n-005
  category: process
  summary: Accept, merge and the retrospective ran before the PR landing, so the records described a state main never had
  evidence_refs:
  - e-001
  - e-021
  details: The acceptance matrix, meta.json and this retrospective were written against the consolidated branch. The landing
    then added fold commits and a squash merge, so meta.json merged_commit points at a commit main does not contain, and the
    acceptance evidence went stale (four connection states, 18 plants, no resume tests, as the later folds changed these).
    The records were repaired after the landing by a records pass on the mission (landed_commit and landed_via were added
    to meta.json).
- id: n-006
  category: review_loop
  summary: Earlier squads yielded only low-severity findings; the late design lens found the major ones
  evidence_refs:
  - e-017
  - e-018
  - e-019
  - e-020
  details: 'The pre-merge R1 round produced 26 findings, all at or below severity 3, which took two fix branches. R2 and R3
    found only 3 nits. The landing second opinion (3 opus lenses) found about 35 findings, 9 of them MAJOR, including the
    3 port gaps (connecting, resync, stub resume) that earlier squads missed and that needed operator decisions. Lesson: put
    a design lens that reads the consumer missions into the plan and pre-merge squads.'
- id: n-007
  category: tooling
  summary: Main first post-merge CI run failed on infrastructure only
  evidence_refs:
